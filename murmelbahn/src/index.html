<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E9E5DE">
<meta name="description" content="Murmelbahn als Design-Skulptur: gebogene Edelstahlbahn um einen gläsernen Lift auf einem Holzsockel. Drehen, zuschauen, abschalten.">
<title>Murmelbahn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#E9E5DE;--panel:rgba(255,255,255,.62);--ink:#26231F;--muted:#6E675E;--accent:#26231F;--accentInk:#F4F1EC;--line:rgba(0,0,0,.14)}
:root[data-raum="abend"]{--bg:#141210;--panel:rgba(0,0,0,.4);--ink:#EDE8E0;--muted:#A79E92;--accent:#E3D9CA;--accentInk:#141210;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:2;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
header a.back{color:var(--muted);text-decoration:none;font-size:.9rem;white-space:nowrap}
header h1{margin:0;font-size:1.1rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
header .info{color:var(--muted);font-size:.8rem;flex:1;min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;min-height:38px;min-width:40px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(92%,460px);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center;font-size:.9rem;transition:opacity .8s;pointer-events:none}
#toast.off{opacity:0}
.anz{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:38px}
.anz input{width:100px;accent-color:var(--accent)}
.anz b{min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
#hebel{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);min-height:64px;padding:10px 26px;font-size:1.05rem;font-weight:600;background:var(--accent);color:var(--accentInk);border:0;box-shadow:0 6px 20px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;touch-action:none;display:none}
#hebel.show{display:block}
#hebel.down{transform:translateX(-50%) translateY(3px) scale(.97);box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media (max-width:620px){.anz input{width:76px}header .lbl{display:none}header .info{order:5;flex-basis:100%}}
</style>
</head>
<body>
<header>
  <a class="back" href="../spiele/">← Spiele</a>
  <h1>Murmelbahn</h1>
  <span class="info" id="info"></span>
  <div class="btns">
    <button class="primary" id="neu" type="button" title="Neue Bahn biegen">🔀<span class="lbl"> Neue Bahn</span></button>
    <label class="anz" title="Anzahl der Murmeln">🔮<input id="anz" type="range" min="1" max="60" step="1" aria-label="Anzahl der Murmeln"><b id="anzv"></b></label>
    <button id="modus" type="button" title="Lift: Dauerlauf, Intervall oder von Hand mit dem Hebel"></button>
    <button id="holz" type="button" title="Holz des Sockels"></button>
    <button id="raum" type="button" title="Hell oder dunkel">🌗</button>
    <button id="dreh" type="button" title="Skulptur langsam drehen">🔄<span class="lbl"> Drehen</span></button>
    <button id="slow" type="button" title="Zeitlupe">🐢</button>
    <button id="ton" type="button" title="Klang an oder aus">🔇</button>
    <button id="pause" type="button" title="Anhalten">⏸</button>
  </div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Murmelbahn-Skulptur"></canvas>
  <div id="toast">Jede Bahn wird neu gebogen. Ziehen dreht die Skulptur, Mausrad oder zwei Finger zoomen. Oben stellst du Anzahl, Lift-Modus und Holz ein.</div>
  <button id="hebel" type="button">✋ Hebel drücken</button>
</div>
<script>
(function () {
  "use strict";
  // Welt in Millimetern, z zeigt nach oben. Murmeln 10 mm, Bahn aus zwei Edelstahldrähten,
  // in der Mitte ein gläserner Lift, darunter ein gedrechselter Holzsockel.
  var RM = 5, RAILW = 3.3, LIFT = Math.sqrt(RM * RM - RAILW * RAILW), WIRE = 0.85;
  var BASE_R = 150, BASE_H = 34, TUBE_R = 9.5, ZTOP = BASE_H + 330, Z0 = ZTOP - 16, ZEND = BASE_H + 15;
  var PITCH = 38, DS = 2, G = 9810, KROLL = 0.565, DRAG = 0.55, MU = 0.004, LIFT_V = 150, MAXM = 60;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
  var X, Y, Z, NX, NY, N = 0, LEN = 0, spokes = [], chimes = [], sections = [];
  var LX, LY, RX, RY, PLX, PLY, PRX, PRY, PD, PF;
  var marbles = [], seed = 0, rng = Math.random, palette = null;
  var target = 8, mode = "dauer", wood = 0, raum = "hell", spin = true;
  function load(k) { try { return localStorage.getItem("murmelbahn-" + k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem("murmelbahn-" + k, String(v)); } catch (e) {} }
  (function () {
    var a = parseInt(load("anzahl"), 10); if (a >= 1 && a <= MAXM) target = a;
    var m = load("modus"); if (m === "dauer" || m === "intervall" || m === "hebel") mode = m;
    var h = parseInt(load("holz"), 10); if (h >= 0 && h < 4) wood = h;
    if (load("raum") === "abend") raum = "abend";
    if (load("drehen") === "0") spin = false;
  })();
  var T = 0, paused = false, slow = false, soundOn = false, lever = false;
  var iv = {phase: "pause", t: 6, count: 0, run: 0};
  var stats = {lifted: 0, released: 0, clicks: 0, chimes: 0};
  var cam = {yaw: .6, tilt: .36, zoom: 1, idle: 0};

  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rr(a, b) { return a + rng() * (b - a); }
  function smooth(u) { u = u < 0 ? 0 : u > 1 ? 1 : u; return u * u * (3 - 2 * u); }

  var WOODS = [
    {name: "Birke", top: ["#F0DFC2", "#D9BF96"], side: ["#C9A97C", "#9C7C55"], grain: "rgba(120,80,40,.10)"},
    {name: "Nussbaum", top: ["#8A6446", "#5E4029"], side: ["#5A3C26", "#36230F"], grain: "rgba(20,10,0,.18)"},
    {name: "Weiß", top: ["#FBFAF7", "#E6E2DA"], side: ["#DCD7CE", "#B9B3A8"], grain: "rgba(0,0,0,.035)"},
    {name: "Schwarz", top: ["#3A3836", "#232120"], side: ["#252322", "#121110"], grain: "rgba(255,255,255,.04)"}
  ];
  var RAUM = {
    hell: {bg: ["#F3F0EB", "#DCD6CC"], floor: "rgba(60,45,30,.20)", steel: "#8E969F", steelHi: "rgba(255,255,255,.9)", steelLo: "#5C636B", glass: "rgba(255,255,255,", ink: "#26231F"},
    abend: {bg: ["#2A2622", "#0F0E0C"], floor: "rgba(0,0,0,.55)", steel: "#9AA2AB", steelHi: "rgba(255,248,235,.85)", steelLo: "#4C535B", glass: "rgba(255,245,230,", ink: "#EDE8E0"}
  };
  var MODES = {dauer: "♾ Dauerlauf", intervall: "⏱ Intervall", hebel: "✋ Hebel"};
  var NAMES = {spirale: "Spirale", bluete: "Blüte", welle: "Welle", schnecke: "Schnecke"};

  // Murmelfarben: jede Bahn bekommt eine eigene Farbfamilie.
  function hsl(h, s, l, a) { return "hsla(" + ((h % 360 + 360) % 360).toFixed(0) + "," + s + "%," + l + "%," + (a == null ? 1 : a) + ")"; }
  function makePalette() {
    var scheme = rng() < .5 ? "bunt" : rng() < .5 ? "verwandt" : "zwei", base = rr(0, 360), out = [];
    for (var i = 0; i < 7; i++) {
      var h = scheme === "bunt" ? base + i * 137.5 : scheme === "verwandt" ? base + rr(-40, 40) : base + (i % 2) * 180 + rr(-15, 15);
      out.push({h: h, s: Math.round(rr(65, 90)), l: Math.round(rr(46, 60)), h2: h + rr(30, 200)});
    }
    return out;
  }
  function newMarble() {
    var p = palette[Math.floor(Math.random() * palette.length)], k = Math.random();
    return {st: "track", s: 0, v: 0, z: 0, rot: Math.random() * 6.28, pz: 0, type: k < .62 ? "swirl" : k < .84 ? "glass" : k < .93 ? "metal" : "auge", h: p.h, sat: p.s, lig: p.l, h2: p.h2};
  }

  // ---------- Bahn biegen ----------
  // Die Bahn läuft in Polarkoordinaten um den Lift. Pro Umdrehung fällt sie mindestens PITCH mm,
  // damit übereinanderliegende Windungen sich nie berühren. Abschnitte: Spirale, Blüte (Radius
  // schwingt in Blättern), Welle (Gefälle wechselt) und Schnecke (wandert nach innen oder außen).
  function generate(s) {
    seed = s; rng = mulberry(s); palette = makePalette();
    var pts = [], th = 0, r = 18, z = Z0, prev = null, dth = .012;
    pts.push([th, r, z]); sections = []; var spokeTh = [];
    function run(sec) {
      var n = Math.max(8, Math.ceil(sec.turns * 6.2832 / dth)), r0 = r;
      for (var k = 1; k <= n; k++) {
        var u = k / n; th += dth;
        var env = smooth(Math.min(u / .2, (1 - u) / .2));
        var rb = r0 + (sec.r1 - r0) * smooth(sec.type === "schnecke" || sec.type === "ende" ? u : u / .3);
        var nr = rb + (sec.type === "bluete" ? sec.A * Math.sin(sec.k * th + sec.ph) * env : 0);
        var slope = sec.slope * (sec.type === "welle" ? 1 + .8 * Math.sin(sec.k * th + sec.ph) * env : 1);
        var dsH = Math.hypot(nr * dth, nr - r);
        z -= Math.max(slope * dsH, PITCH * dth / 6.2832);
        r = nr; pts.push([th, r, z]);
      }
    }
    function perTurn(sec) { return Math.max(sec.slope * 6.2832 * (r + sec.r1) / 2, PITCH); }
    var guard = 0;
    for (;;) {
      if (guard++ > 30) break;
      var types = ["spirale", "bluete", "welle", "schnecke"].filter(function (t) { return t !== prev; });
      var type = types[Math.floor(rng() * types.length)], sec = {type: type, slope: rr(.055, .085), turns: rr(.8, 1.6), k: 3 + Math.floor(rng() * 3), ph: rr(0, 6.28)};
      if (type === "schnecke") sec.r1 = r > 92 ? rr(50, 64) : rr(108, 128);
      else if (type === "bluete") { sec.r1 = rr(78, 98); sec.A = rr(18, 28); }
      else sec.r1 = rr(66, 122);
      if (!pts[1]) sec.turns = Math.max(sec.turns, 1.1);
      var remain = z - ZEND - 24;
      if (remain < PITCH * .5) break;
      if (sec.turns * perTurn(sec) > remain) { sec.turns = remain / perTurn(sec); if (sec.turns < .5) break; }
      run(sec); sections.push(type); prev = type;
    }
    run({type: "ende", r1: 18, slope: .06, turns: .55});
    var k = (Z0 - ZEND) / (Z0 - z);
    pts.forEach(function (p) { p[2] = Z0 - (Z0 - p[2]) * k; });
    // auf gleichmäßige Abstände entlang der Bahn umrechnen
    var P = pts.map(function (p) { return [p[1] * Math.cos(p[0]), p[1] * Math.sin(p[0]), p[2], p[0]]; }), cum = [0];
    for (var i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1], P[i][2] - P[i - 1][2]));
    LEN = cum[cum.length - 1]; N = Math.floor(LEN / DS) + 1;
    X = new Float32Array(N); Y = new Float32Array(N); Z = new Float32Array(N); NX = new Float32Array(N); NY = new Float32Array(N);
    var TH = new Float32Array(N), j = 0;
    for (i = 0; i < N; i++) {
      var sp = i * DS; while (j < cum.length - 2 && cum[j + 1] < sp) j++;
      var f = (sp - cum[j]) / ((cum[j + 1] - cum[j]) || 1); f = f < 0 ? 0 : f > 1 ? 1 : f;
      X[i] = P[j][0] + (P[j + 1][0] - P[j][0]) * f; Y[i] = P[j][1] + (P[j + 1][1] - P[j][1]) * f; Z[i] = P[j][2] + (P[j + 1][2] - P[j][2]) * f; TH[i] = P[j][3] + (P[j + 1][3] - P[j][3]) * f;
    }
    for (i = 0; i < N; i++) {
      var a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1), tx = X[b] - X[a], ty = Y[b] - Y[a], tl = Math.hypot(tx, ty) || 1;
      NX[i] = ty / tl; NY[i] = -tx / tl; // zeigt nach außen, weil die Bahn gegen den Uhrzeigersinn läuft
      if (NX[i] * X[i] + NY[i] * Y[i] < 0) { NX[i] = -NX[i]; NY[i] = -NY[i]; }
    }
    LX = new Float32Array(N); LY = new Float32Array(N); RX = new Float32Array(N); RY = new Float32Array(N);
    for (i = 0; i < N; i++) { LX[i] = X[i] - NX[i] * RAILW; LY[i] = Y[i] - NY[i] * RAILW; RX[i] = X[i] + NX[i] * RAILW; RY[i] = Y[i] + NY[i] * RAILW; }
    PLX = new Float32Array(N); PLY = new Float32Array(N); PRX = new Float32Array(N); PRY = new Float32Array(N); PD = new Float32Array(N); PF = new Float32Array(N);
    // Speichen vom Lift zur Bahn, etwa alle 60 Grad
    spokes = []; var nextTh = 1.2;
    for (i = 0; i < N - 8; i++) if (TH[i] >= nextTh) { spokes.push(i); nextTh += 2.094; }
    // Klangstäbe an einigen Stellen außen an der Bahn
    chimes = []; var nc = 4 + Math.floor(rng() * 3);
    for (i = 0; i < nc; i++) {
      var ci = Math.floor(N * (.1 + .8 * (i + rr(.2, .8)) / nc)), c = {i: ci, s: ci * DS, len: rr(18, 30), hit: 0};
      chimes.push(c);
    }
    chimes.sort(function (a, b) { return Z[b.i] - Z[a.i]; }).forEach(function (c, n) { c.note = n; });
    var url = new URL(location.href); url.searchParams.set("bahn", String(s)); history.replaceState(null, "", url);
    updateInfo();
  }

  // ---------- Physik ----------
  // Jede Murmel liegt auf zwei Drähten und hat nur eine Lage s entlang der Bahn und ein Tempo v.
  // Beschleunigung aus dem Gefälle (rollende Kugel auf Schienen), Luft- und Rollwiderstand.
  // Murmeln stoßen sich entlang der Bahn, am Ende stauen sie sich vor dem Lift.
  function slopeAt(s) { var i = Math.min(N - 2, Math.max(0, Math.floor(s / DS))); return (Z[i + 1] - Z[i]) / DS; }
  function onTrack() { return marbles.filter(function (m) { return m.st === "track"; }).sort(function (a, b) { return a.s - b.s; }); }
  function step(dt) {
    var tr = onTrack(), i, m;
    for (i = 0; i < tr.length; i++) {
      m = tr[i];
      var a = -KROLL * G * slopeAt(m.s) - DRAG * m.v;
      if (Math.abs(m.v) > 2) a -= (m.v > 0 ? 1 : -1) * MU * G; else if (Math.abs(a) < MU * G) { a = 0; m.v *= .5; }
      m.v += a * dt; m.s += m.v * dt;
      if (m.s < RM) { m.s = RM; if (m.v < 0) m.v = -m.v * .3; }
      if (m.s > LEN - RM) { m.s = LEN - RM; if (m.v > 0) { if (m.v > 90) snd("stop", m.v); m.v = -m.v * .15; } }
      if (!isFinite(m.s) || !isFinite(m.v)) { m.s = LEN - RM; m.v = 0; }
    }
    for (var pass = 0; pass < 3; pass++) {
      for (i = 0; i + 1 < tr.length; i++) {
        var A = tr[i], B = tr[i + 1], gap = B.s - A.s;
        if (gap >= 2 * RM) continue;
        var pen = 2 * RM - gap;
        if (B.s + pen / 2 > LEN - RM) A.s -= pen; else { A.s -= pen / 2; B.s += pen / 2; }
        if (A.v > B.v) {
          var rel = A.v - B.v, mean = (A.v + B.v) / 2;
          A.v = mean - .88 * rel / 2; B.v = mean + .88 * rel / 2;
          if (rel > 90 && pass === 0) { snd("klick", rel); stats.clicks++; }
        }
      }
    }
    for (i = 0; i < tr.length; i++) tr[i].rot += tr[i].v / RM * dt;
  }
  function liftRunning() { return mode === "dauer" || (mode === "hebel" && lever) || (mode === "intervall" && iv.phase === "run"); }
  function frameLogic(dt) {
    var run = liftRunning(), speed = LIFT_V * (mode === "hebel" ? 1.3 : 1), up = marbles.filter(function (m) { return m.st === "lift"; }).sort(function (a, b) { return b.z - a.z; });
    var zIn = ZEND + LIFT, zOut = Z0 + LIFT, tr = onTrack();
    var startFree = !tr.length || tr[0].s > 2 * RM + 3;
    for (var i = 0; i < up.length; i++) {
      var m = up[i];
      if (run) { var nz = m.z + speed * dt; if (i > 0) nz = Math.min(nz, up[i - 1].z - 2 * RM - 1); m.z = Math.max(m.z, Math.min(nz, zOut)); m.rot += speed * dt / RM; }
      if (i === 0 && m.z >= zOut - .01 && startFree) { m.st = "track"; m.s = RM + .5; m.v = 70; stats.released++; snd("tick", 200); startFree = false; }
    }
    // Einlauf unten: die vorderste Murmel im Stau rollt in den Lift, sobald dort Platz ist
    var front = tr[tr.length - 1], low = up.length ? up[up.length - 1] : null;
    if (run && front && front.s >= LEN - RM - 2 && Math.abs(front.v) < 150 && (!low || low.z > zIn + 2 * RM + 1)) {
      front.st = "lift"; front.z = zIn; stats.lifted++; iv.count++; snd("tock", 300);
    }
    if (mode === "intervall") {
      if (iv.phase === "pause") { iv.t -= dt; if (iv.t <= 0) { iv.phase = "run"; iv.count = 0; iv.run = 0; } }
      else { iv.run += dt; var lifting = marbles.some(function (m) { return m.st === "lift"; }); if ((iv.count >= marbles.length && !lifting) || iv.run > 90) { iv.phase = "pause"; iv.t = 20; } }
    }
    chimes.forEach(function (c) { c.hit = Math.max(0, c.hit - dt * 1.2); });
    marbles.forEach(function (m) {
      if (m.st === "track") { chimes.forEach(function (c) { if (m.pz < c.s && m.s >= c.s && m.s - m.pz < 40) { c.hit = 1; snd("chime", c.note); stats.chimes++; } }); m.pz = m.s; }
      else m.pz = 0;
    });
  }

  // ---------- Klang ----------
  var actx = null, roll = null, PENTA = [0, 2, 4, 7, 9], lastSnd = {};
  function snd(kind, v) {
    if (!soundOn || !actx) return;
    var now = actx.currentTime, gap = {klick: .03, chime: .02, tock: .05, tick: .05, stop: .06}[kind];
    if (kind !== "chime" && now - (lastSnd[kind] || 0) < gap) return; lastSnd[kind] = now;
    var o = actx.createOscillator(), g = actx.createGain(), dur, vol;
    if (kind === "chime") {
      var semi = 12 + Math.floor(v / 5) * -12 + PENTA[4 - v % 5]; o.type = "sine"; o.frequency.value = 523.25 * Math.pow(2, semi / 12 - 1); dur = 2.2; vol = .09;
      var o2 = actx.createOscillator(), g2 = actx.createGain(); o2.type = "sine"; o2.frequency.value = o.frequency.value * 2.76;
      g2.gain.setValueAtTime(.025, now); g2.gain.exponentialRampToValueAtTime(.0001, now + .6); o2.connect(g2).connect(actx.destination); o2.start(now); o2.stop(now + .65);
    } else if (kind === "klick") { o.type = "sine"; o.frequency.value = 2600 + Math.random() * 1400; dur = .04; vol = .02 + Math.min(.06, v / 9000); }
    else if (kind === "tock") { o.type = "triangle"; o.frequency.value = 330; dur = .09; vol = .05; }
    else if (kind === "tick") { o.type = "sine"; o.frequency.value = 1500; dur = .05; vol = .03; }
    else { o.type = "sine"; o.frequency.value = 1900 + Math.random() * 500; dur = .06; vol = .04; }
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(.0001, now + dur);
    o.connect(g).connect(actx.destination); o.start(now); o.stop(now + dur + .02);
  }
  function startRoll() {
