<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Japanisch lernen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fffdf8'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23c8402f'/%3E%3C/svg%3E">
<script src="../../config.js"></script>
<script src="../ton.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&family=Klee+One:wght@600&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Aufbau: Kopf mit Punkten, Serie und Stufe; darunter Reiter Start, Schrift, Lesen, Sprechen, Dialoge, Schreiben. Farben: Washi-Papier, Indigo und Zinnoberrot. */
:root{
  --bg:#f6f1e7; --surface:#fffdf8; --fg:#1d2433; --muted:#6b6559; --line:#e3dbcb; --chip:#efe7d6;
  --ai:#27408b; --shu:#c8402f; --matcha:#4f7a2e; --gold:#a8760b; --bad:#b3261e;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --brush:"Klee One","Zen Kaku Gothic New","Hiragino Mincho ProN",serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161c; --surface:#1c1f27; --fg:#ece6da; --muted:#a39d90; --line:#2e323c; --chip:#252934;
  --ai:#8ea6ec; --shu:#ef7a68; --matcha:#9cc275; --gold:#e0b44a; --bad:#f2867d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161c; --surface:#1c1f27; --fg:#ece6da; --muted:#a39d90; --line:#2e323c; --chip:#252934;
  --ai:#8ea6ec; --shu:#ef7a68; --matcha:#9cc275; --gold:#e0b44a; --bad:#f2867d; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.7rem,5vw,2.4rem)}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
.jp{font-family:var(--jp)}
a{color:var(--ai)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{font-size:.9rem;text-decoration:none;color:var(--muted)}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.title .jp{font-size:clamp(1.5rem,4vw,2rem);color:var(--shu);font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:92px}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.85rem}
.icon{background:var(--chip);border:0;border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:1.05rem;display:inline-grid;place-items:center;flex:none}
.note{background:var(--chip);border-radius:10px;padding:10px 14px;font-size:.9rem;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--shu),var(--gold));border-radius:4px;transition:width .4s}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--matcha) 18%,transparent);color:var(--matcha)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:.92rem;cursor:pointer}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input[type=text]{width:100%}
ruby rt{font-size:.5em;color:var(--muted);font-family:var(--jp)}
.nofuri rt{visibility:hidden}

/* Start */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:110px;height:110px}
.week{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:26px;background:var(--ai);border-radius:4px 4px 0 0;min-height:2px}
.week span{font-size:.7rem;color:var(--muted)}
.go{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;cursor:pointer}
.go .jp{font-size:1.6rem;color:var(--shu)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.82rem;padding:5px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--gold);color:var(--fg);background:color-mix(in srgb,var(--gold) 14%,transparent)}

/* Schrift */
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kgrid.y{grid-template-columns:repeat(3,1fr)}
.kcell{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 4px;text-align:center;cursor:pointer;position:relative}
.kcell .c{font-family:var(--jp);font-size:1.7rem;line-height:1.2;display:block}
.kcell .r{font-size:.75rem;color:var(--muted)}
.kcell.l1{background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.kcell.l2{background:color-mix(in srgb,var(--matcha) 20%,var(--surface));border-color:color-mix(in srgb,var(--matcha) 45%,var(--line))}
.kcell.empty{visibility:hidden}
.kcell.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.kanjis{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.kj{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.kj .c{font-family:var(--brush);font-size:2.1rem;display:block;line-height:1.2}
.kj .m{font-size:.75rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kj.l2{border-color:var(--matcha)}
.kdetail{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.kdetail .big{font-family:var(--brush);font-size:5rem;line-height:1;color:var(--shu)}

/* Quiz */
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-prompt{text-align:center;padding:14px 0 18px}
.q-prompt .big{font-family:var(--jp);font-size:clamp(3rem,14vw,4.6rem);line-height:1.15;display:block}
.q-prompt .mid{font-size:1.6rem;font-weight:700;display:block}
.q-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 8px;font-size:1.15rem;font-weight:700;cursor:pointer;min-height:56px}
.opt.jpopt{font-family:var(--jp);font-size:1.7rem;font-weight:400}
.opt.ok{border-color:var(--matcha);background:color-mix(in srgb,var(--matcha) 16%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.q-fb{min-height:1.6em;text-align:center;margin-top:10px;font-weight:700}
.good{color:var(--matcha)} .badtxt{color:var(--bad)}

/* Lesen */
.drill{text-align:center}
.drill .word{font-family:var(--jp);font-size:clamp(2.4rem,10vw,3.6rem);line-height:1.3}
.drill .preview{font-family:var(--jp);font-size:1.3rem;min-height:1.6em;color:var(--ai)}
.texts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tcard{text-align:left;cursor:pointer}
.tcard .jp{font-size:1.2rem;display:block}
.reader{font-family:var(--jp);font-size:1.35rem;line-height:2.3}
.reader .s{cursor:pointer;border-radius:6px;padding:0 2px}
.reader .s:hover,.reader .s.on{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.trans{font-size:.95rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.question{display:flex;flex-direction:column;gap:6px}
.question .row button{flex:1 1 160px;text-align:left}

/* Sprechen */
.phrase{text-align:center;padding:10px 0}
.phrase .jp{font-size:clamp(1.6rem,6vw,2.3rem);line-height:2.1;display:block}
.phrase .de{color:var(--muted);font-size:1.05rem}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--shu);color:#fff;font-size:1.9rem;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--shu) 35%,transparent)}
.mic.rec{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--shu) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.result{min-height:3.2em;text-align:center}
.result .heard{font-family:var(--jp);font-size:1.15rem}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.dots button{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:var(--chip);padding:0;cursor:pointer}
.dots button.s1{background:var(--gold);border-color:var(--gold)}
.dots button.s2{background:var(--matcha);border-color:var(--matcha)}
.dots button.cur{outline:2px solid var(--fg);outline-offset:1px}

/* Dialoge */
.dlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.lines{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.line{max-width:86%;border-radius:16px;padding:10px 14px;border:1px solid var(--line);background:var(--surface)}
.line.A{align-self:flex-start;border-bottom-left-radius:4px}
.line.B{align-self:flex-end;border-bottom-right-radius:4px;background:color-mix(in srgb,var(--ai) 10%,var(--surface))}
.line .who{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.line .jp{font-size:1.25rem;line-height:2.1;display:block}
.line .de{font-size:.9rem;color:var(--muted)}
.line.speaking{border-color:var(--shu);box-shadow:0 0 0 2px color-mix(in srgb,var(--shu) 25%,transparent)}
.line .task{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

/* Schreiben */
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px;border-radius:12px;border:1px dashed var(--line)}
.tiles.answer{background:var(--chip);border-style:solid}
.tile{font-family:var(--jp);font-size:1.25rem;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 12px;cursor:pointer;line-height:1.9}
.tile:disabled{opacity:.25;cursor:default}
.trace{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center}
.trace canvas{border-radius:16px;background:var(--surface);border:1px solid var(--line);touch-action:none;width:260px;height:260px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .q-opts{grid-template-columns:1fr 1fr}
  .kdetail{grid-template-columns:1fr;text-align:center}
  .line{max-width:96%}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span><a class="back" href="../">← Sprachen</a> <span class="muted">·</span> <a class="back" href="../hilfe/">🔊 Kein Ton?</a></span>
    <div class="row">
      <span class="small muted">Stufe:</span>
      <div class="seg" id="levelSeg" role="group" aria-label="Niveau">
        <button data-level="anf">Anfänger</button>
        <button data-level="fort">Fortgeschritten</button>
      </div>
    </div>
  </div>
  <div class="title"><h1>Japanisch</h1><span class="jp">日本語</span></div>
  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <button data-tab="start">Start</button>
    <button data-tab="schrift">Schrift</button>
    <button data-tab="lesen">Lesen</button>
    <button data-tab="sprechen">Sprechen</button>
    <button data-tab="dialoge">Dialoge</button>
    <button data-tab="schreiben">Schreiben</button>
  </nav>

  <section id="v-start" class="stack"></section>

  <section id="v-schrift" class="stack" hidden>
    <div class="row" style="justify-content:space-between">
      <div class="seg" id="scriptSeg" role="group" aria-label="Schrift">
        <button data-s="h">Hiragana</button><button data-s="k">Katakana</button><button data-s="kanji">Kanji</button>
      </div>
      <button class="btn primary" id="startScriptQuiz">Quiz starten</button>
    </div>
    <div id="scriptQuiz" class="card" hidden></div>
    <div id="scriptBody" class="stack"></div>
  </section>

  <section id="v-lesen" class="stack" hidden></section>
  <section id="v-sprechen" class="stack" hidden></section>
  <section id="v-dialoge" class="stack" hidden></section>
  <section id="v-schreiben" class="stack" hidden></section>

  <p class="small muted" id="store" style="margin-top:28px"></p>
</div>
<div class="toast" id="toast"></div>
<script>
// ---------- Daten ----------
// Kanji mit Lesung stehen als 漢字{かんじ}; daraus entstehen Schriftbild, Lesung und Furigana.
const KANA_SRC = {
  basic: "あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をwo んn",
  daku: "がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo",
  yoon: "きゃkya きゅkyu きょkyo しゃsha しゅshu しょsho ちゃcha ちゅchu ちょcho にゃnya にゅnyu にょnyo ひゃhya ひゅhyu ひょhyo みゃmya みゅmyu みょmyo りゃrya りゅryu りょryo ぎゃgya ぎゅgyu ぎょgyo じゃja じゅju じょjo びゃbya びゅbyu びょbyo ぴゃpya ぴゅpyu ぴょpyo"
};
const KANA = [];
for (const [g, s] of Object.entries(KANA_SRC)) for (const tok of s.split(" ")) { const m = tok.match(/^([^a-z]+)([a-z]+)$/); KANA.push({k: m[1], r: m[2], g}); }
const AMBIG = new Set(["ぢ", "づ"]);
const GROUP_NAMES = {basic: "Grundzeichen", daku: "Mit Strichen (゛゜)", yoon: "Kombinationen (ゃゅょ)"};

const KANJI = {
  anf: [
    ["一","eins","イチ","ひと(つ)","一{ひと}つ","eins (Stück)"],["二","zwei","ニ","ふた(つ)","二人{ふたり}","zwei Personen"],["三","drei","サン","みっ(つ)","三月{さんがつ}","März"],
    ["四","vier","シ","よん, よ(つ)","四時{よじ}","vier Uhr"],["五","fünf","ゴ","いつ(つ)","五分{ごふん}","fünf Minuten"],["六","sechs","ロク","むっ(つ)","六時{ろくじ}","sechs Uhr"],
    ["七","sieben","シチ","なな","七月{しちがつ}","Juli"],["八","acht","ハチ","やっ(つ)","八百屋{やおや}","Gemüseladen"],["九","neun","キュウ, ク","ここの(つ)","九月{くがつ}","September"],
    ["十","zehn","ジュウ","とお","十月{じゅうがつ}","Oktober"],["百","hundert","ヒャク","","百円{ひゃくえん}","100 Yen"],["千","tausend","セン","ち","千円{せんえん}","1000 Yen"],
    ["円","Yen, Kreis","エン","まる(い)","円高{えんだか}","starker Yen"],["日","Tag, Sonne","ニチ, ジツ","ひ, か","日本{にほん}","Japan"],["月","Monat, Mond","ゲツ, ガツ","つき","月曜日{げつようび}","Montag"],
    ["火","Feuer","カ","ひ","火曜日{かようび}","Dienstag"],["水","Wasser","スイ","みず","水曜日{すいようび}","Mittwoch"],["木","Baum","モク","き","木曜日{もくようび}","Donnerstag"],
    ["金","Gold, Geld","キン","かね","金曜日{きんようび}","Freitag"],["土","Erde","ド","つち","土曜日{どようび}","Samstag"],["人","Mensch","ジン, ニン","ひと","日本人{にほんじん}","Japaner"],
    ["口","Mund","コウ","くち","入口{いりぐち}","Eingang"],["目","Auge","モク","め","目薬{めぐすり}","Augentropfen"],["山","Berg","サン","やま","富士山{ふじさん}","Berg Fuji"],
    ["川","Fluss","セン","かわ","川口{かわぐち}","Flussmündung"],["大","groß","ダイ, タイ","おお(きい)","大学{だいがく}","Universität"],["小","klein","ショウ","ちい(さい)","小学校{しょうがっこう}","Grundschule"],
    ["中","Mitte, innen","チュウ","なか","中国{ちゅうごく}","China"],["上","oben","ジョウ","うえ","上手{じょうず}","geschickt"],["下","unten","カ, ゲ","した","地下鉄{ちかてつ}","U-Bahn"],
    ["右","rechts","ウ","みぎ","右手{みぎて}","rechte Hand"],["左","links","サ","ひだり","左手{ひだりて}","linke Hand"],["本","Buch, Ursprung","ホン","もと","本屋{ほんや}","Buchladen"],
    ["学","lernen","ガク","まな(ぶ)","学生{がくせい}","Student"],["生","Leben","セイ","い(きる), う(まれる)","先生{せんせい}","Lehrer"],["年","Jahr","ネン","とし","今年{ことし}","dieses Jahr"],
    ["時","Zeit, Stunde","ジ","とき","時間{じかん}","Zeit"],["食","essen","ショク","た(べる)","食堂{しょくどう}","Kantine"],["行","gehen","コウ","い(く)","銀行{ぎんこう}","Bank"],
    ["見","sehen","ケン","み(る)","花見{はなみ}","Kirschblütenschau"],["話","sprechen","ワ","はな(す)","電話{でんわ}","Telefon"],["語","Sprache","ゴ","かた(る)","日本語{にほんご}","Japanisch"]
  ],

const RUBY_RE = /([一-鿿々〆ヶ]+)\{([^}]+)\}/g;

const K2R = {};
for (const x of KANA) if (!K2R[x.k]) K2R[x.k] = x.r;
Object.assign(K2R, {"ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o","ゃ":"ya","ゅ":"yu","ょ":"yo","ゔ":"vu","ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","てぃ":"ti","でぃ":"di","でゅ":"dyu","うぃ":"wi","うぇ":"we","うぉ":"wo","しぇ":"she","じぇ":"je","ちぇ":"che","ゔぁ":"va","ゔぃ":"vi","ゔぇ":"ve","ゔぉ":"vo"});
function kanaToRomaji(s) {
  s = toHira(s); let out = "", i = 0, dbl = false;
  while (i < s.length) {
    const c = s[i];
    if (c === "っ") { dbl = true; i++; continue; }
    if (c === "ー") { const v = out.match(/[aeiou]$/); if (v) out += v[0]; i++; continue; }
    let r, len;
    if (K2R[s.substr(i, 2)]) { r = K2R[s.substr(i, 2)]; len = 2; }
    else if (K2R[c]) { r = K2R[c]; len = 1; }
    else { r = c; len = 1; }
    if (dbl) { out += r.startsWith("ch") ? "t" : (/^[b-df-hj-np-tv-z]/.test(r) ? r[0] : ""); dbl = false; }
    out += r; i += len;
  }

}
const R2K = {};
for (const x of KANA) if (!AMBIG.has(x.k) && !(x.r in R2K)) R2K[x.r] = x.k;
Object.assign(R2K, {si:"し",ti:"ち",tu:"つ",hu:"ふ",zi:"じ",di:"ぢ",du:"づ",sya:"しゃ",syu:"しゅ",syo:"しょ",tya:"ちゃ",tyu:"ちゅ",tyo:"ちょ",cya:"ちゃ",cyu:"ちゅ",cyo:"ちょ",zya:"じゃ",zyu:"じゅ",zyo:"じょ",jya:"じゃ",jyu:"じゅ",jyo:"じょ",fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ",she:"しぇ",je:"じぇ",che:"ちぇ",thi:"てぃ",dhi:"でぃ",wi:"うぃ",we:"うぇ",vu:"ゔ",va:"ゔぁ",vi:"ゔぃ",ve:"ゔぇ",vo:"ゔぉ","-":"ー",xa:"ぁ",xi:"ぃ",xu:"ぅ",xe:"ぇ",xo:"ぉ",xtu:"っ",xya:"ゃ",xyu:"ゅ",xyo:"ょ"});
// Romaji wie bei einer japanischen Tastatur: nn oder n vor Konsonant wird ん, Doppelkonsonant wird っ.
function romajiToKana(s) {
  s = s.toLowerCase().replace(/[āâ]/g, "aa").replace(/[ōô]/g, "ou").replace(/[ūû]/g, "uu").replace(/[ēê]/g, "ee").replace(/[īî]/g, "ii");

  while (i < s.length) {
    const c = s[i], n1 = s[i + 1] || "", n2 = s[i + 2] || "";

      if (n1 === "'" || (n1 === "n" && !(n2 && V.includes(n2)))) i += 2; else i += 1;
      out += "ん"; continue;
    }
    if (c === n1 && /[bcdfghjkmpqrstvwxz]/.test(c)) { out += "っ"; i++; continue; }
    if (c === "t" && n1 === "c" && n2 === "h") { out += "っ"; i++; continue; }
    let hit = false;
    for (const L of [3, 2, 1]) { const p = s.substr(i, L); if (p.length === L && R2K[p]) { out += R2K[p]; i += L; hit = true; break; } }

// Vergleichsform: Hiragana, ohne Satzzeichen, Langvokalstrich ausgeschrieben, Partikel wie gesprochen.
function normJa(s) {

  const o = Object.assign(fresh(), (a.updated || 0) >= (b.updated || 0) ? a : b);

  for (const k of ["days", "said", "dialogs"]) { o[k] = {...(a[k] || {})}; for (const [x, v] of Object.entries(b[k] || {})) o[k][x] = Math.max(o[k][x] || 0, v); }

function mcQuiz(box, gen, onStop) {
  const g = box._gen = (box._gen || 0) + 1; let right = 0, total = 0, last = null;
  function next() {
    if (box._gen !== g) return;
    const q = gen(last); last = q.key;
    box.innerHTML = `<div class="q-head"><span class="muted small">${right} von ${total} richtig</span><button class="ghost" data-stop>Beenden</button></div>
      <div class="q-prompt">${q.prompt}</div>
      <div class="q-opts">${q.options.map((o, i) => `<button class="opt ${q.jpOpts ? "jpopt" : ""}" data-i="${i}">${o.html}</button>`).join("")}</div>
      <div class="q-fb" aria-live="polite"></div>`;
    if (q.audio) speak(q.audio);
    box.querySelector("[data-stop]").onclick = () => { box._gen++; onStop(); };
    for (const b of box.querySelectorAll(".opt")) b.onclick = () => {
      const o = q.options[+b.dataset.i]; total++; if (o.correct) right++;
      box.querySelectorAll(".opt").forEach((x, i) => { x.disabled = true; if (q.options[i].correct) x.classList.add("ok"); });
      if (!o.correct) b.classList.add("bad");
      q.onAnswer(o.correct);
      box.querySelector(".q-fb").innerHTML = o.correct ? `<span class="good">Richtig</span>` : `<span class="badtxt">Richtig wäre: ${q.solution}</span>`;
      if (o.correct) addPoints(q.pts || 5); else save();
      if (q.after) speak(q.after);
      setTimeout(next, o.correct ? 900 : 2000);
    };
  }
  next();
}
function optionsFrom(correct, pool, label, n = 4) {
  const seen = new Set([label(correct)]), out = [{html: label(correct), correct: true}];
  for (const x of shuffle(pool)) { if (out.length >= n) break; const l = label(x); if (!seen.has(l)) { seen.add(l); out.push({html: l, correct: false}); } }
  return shuffle(out);
}

async function attempt(btn, out, t, id, done) {
  const award = (score, heard) => {
    const prev = S.said[id] || 0; S.said[id] = Math.max(prev, score);
    const pts = score >= 0.9 ? 15 : score >= 0.75 ? 10 : 2;
    const verdict = score >= 0.9 ? "Sehr gut! すばらしい" : score >= 0.75 ? "Gut verstanden. いいね" : "Noch nicht ganz. Hör noch einmal hin und versuch es nochmal.";
    out.innerHTML = `${heard ? `<div class="heard">„${esc(heard)}“</div>` : ""}<div class="bar" style="max-width:260px;margin:6px auto"><i style="width:${Math.round(score * 100)}%"></i></div><b class="${score >= 0.75 ? "good" : "badtxt"}">${verdict}</b>`;
    addPoints(pts);
    if (done && score >= 0.75) setTimeout(() => { const d = out.closest(".card").querySelector(".dots"); if (d) { const c = d.querySelector(".cur"); if (c) c.className = "cur " + (score >= 0.9 ? "s2" : "s1"); } }, 0);
    return score;
  };
  if (!SR) {
    return new Promise(res => {
      out.innerHTML = `<div class="row" style="justify-content:center"><span class="small">Wie lief es?</span><button class="btn" data-self="0.95">Sehr gut</button><button class="btn" data-self="0.8">Gut</button><button class="btn" data-self="0.4">Nochmal</button></div>`;
      for (const b of out.querySelectorAll("[data-self]")) b.onclick = () => res(award(+b.dataset.self, ""));
    });
  }
  btn.classList.add("rec"); btn.disabled = true; out.innerHTML = `<span class="muted">Ich höre zu …</span>`;
  try {
    const alts = await listen();
    if (!alts.length) { out.innerHTML = `<span class="badtxt">Nichts verstanden. Tipp aufs Mikrofon und sprich etwas lauter.</span>`; return null; }
    const {score, heard} = speechScore(alts, t);
    return award(score, heard);
  } catch (e) {
    out.innerHTML = `<span class="badtxt">${e === "not-allowed" || e === "service-not-allowed" ? "Mikrofon ist gesperrt. Bitte im Browser für diese Seite erlauben." : "Spracherkennung hat nicht geklappt (" + esc(e) + ")."}</span>`;
    return null;
  } finally { btn.classList.remove("rec"); btn.disabled = false; }
}

// ---------- Dialoge ----------
let dlgGen = 0, dlgOpen = null;
RENDER.dialoge = () => {
  const list = DIALOGS[S.level];
  $("#v-dialoge").innerHTML = `
    <div class="card stack">
      <h3>Dialoge</h3>
      <p class="small muted">Erst anhören, dann mitspielen: Du bist B und sprichst deine Zeilen, das Gegenüber antwortet mit Sprachausgabe.</p>
      <div class="dlist">${list.map(d => `<button class="card tcard" data-d="${d.id}"><span class="jp">${esc(d.jp)}</span><span class="small muted">${esc(d.title)}</span> ${S.dialogs[d.id] ? `<span class="pill ok">${Math.round(S.dialogs[d.id] * 100)} %</span>` : ""}</button>`).join("")}</div>
    </div>
    <div class="card" id="dlgBox" hidden></div>`;
  for (const b of document.querySelectorAll("[data-d]")) b.onclick = () => openDialog(list.find(d => d.id === b.dataset.d));
  if (dlgOpen && list.find(d => d.id === dlgOpen)) openDialog(list.find(d => d.id === dlgOpen));
};
function lineHtml(l, hide) {
  return `<div class="line ${l[0]}"><div class="who">${l[0] === "A" ? "Gegenüber" : "Du"}</div>
    <span class="jp" ${hide ? "hidden" : ""}>${ruby(l[1])}</span><div class="de">${esc(l[2])}</div></div>`;
}
function openDialog(d) {
  dlgOpen = d.id; dlgGen++;
  const box = $("#dlgBox"); box.hidden = false;
  box.innerHTML = `<div class="row" style="justify-content:space-between"><h3><span class="jp">${esc(d.jp)}</span> · ${esc(d.title)}</h3>
      <div class="row"><button class="btn" id="dlgListen">▶ Anhören</button><button class="btn primary" id="dlgPlay">🎤 Mitspielen</button></div></div>
    <div class="lines" id="dlgLines">${d.lines.map(l => lineHtml(l, false)).join("")}</div><div class="q-fb" id="dlgFb"></div>`;
  $("#dlgListen").onclick = () => runDialog(d, "listen");
  $("#dlgPlay").onclick = () => runDialog(d, "play");
  for (const [i, el] of [...box.querySelectorAll(".line")].entries()) el.onclick = () => speak(plain(d.lines[i][1]));
  box.scrollIntoView({behavior: "smooth", block: "start"});
}
async function runDialog(d, mode) {
  const g = ++dlgGen, box = $("#dlgLines"); box.innerHTML = ""; $("#dlgFb").innerHTML = "";
  let sum = 0, n = 0;
  for (const l of d.lines) {
    if (g !== dlgGen) return;
    const wrap = document.createElement("div"); wrap.innerHTML = lineHtml(l, mode === "play" && l[0] === "B"); const row = wrap.firstElementChild; box.append(row);
    row.scrollIntoView({behavior: "smooth", block: "nearest"});
    if (mode === "listen" || l[0] === "A") { row.classList.add("speaking"); await speak(plain(l[1])); row.classList.remove("speaking"); await wait(350); continue; }
    const s = await userTurn(row, l, g); if (s === null) return;
    sum += s; n++;
  }
  if (mode === "play" && g === dlgGen) {
    const avg = n ? sum / n : 0; S.dialogs[d.id] = Math.max(S.dialogs[d.id] || 0, avg);
    const bonus = Math.round(10 + 20 * avg); addPoints(bonus);
    $("#dlgFb").innerHTML = `<span class="good">Dialog geschafft, im Schnitt ${Math.round(avg * 100)} %. Bonus +${bonus}.</span>`;
  }
}
function userTurn(row, l, g) {
  return new Promise(res => {
    const task = document.createElement("div"); task.className = "task";
    task.innerHTML = `<button class="mic" style="width:52px;height:52px;font-size:1.3rem" aria-label="Sprechen">🎤</button><button class="ghost" data-hint>Japanisch zeigen</button><button class="ghost" data-say="${esc(plain(l[1]))}">🔊 Vorsagen</button><button class="ghost" data-next>Weiter →</button><div class="result small" style="flex-basis:100%;text-align:left;min-height:0"></div>`;
    row.append(task);
    let best = 0;
    const out = task.querySelector(".result"), mic = task.querySelector(".mic");
    task.querySelector("[data-hint]").onclick = () => { row.querySelector(".jp").hidden = false; };
    mic.onclick = async () => {
      const s = await attemptLine(mic, out, l[1]); if (s !== null) { best = Math.max(best, s); row.querySelector(".jp").hidden = false; }
    };
    task.querySelector("[data-next]").onclick = () => { task.remove(); row.querySelector(".jp").hidden = false; res(g === dlgGen ? best : null); };
  });
}
async function attemptLine(btn, out, t) {
  if (!SR) {
    return new Promise(r => {
      out.innerHTML = `<span>Selbst bewerten:</span> <button class="ghost" data-s="0.95">Sehr gut</button> <button class="ghost" data-s="0.8">Gut</button> <button class="ghost" data-s="0.4">Nochmal</button>`;
      for (const b of out.querySelectorAll("[data-s]")) b.onclick = () => { out.innerHTML = ""; r(+b.dataset.s); };
    });
  }
  btn.classList.add("rec"); btn.disabled = true; out.textContent = "Ich höre zu …";
  try {
    const alts = await listen(); if (!alts.length) { out.textContent = "Nichts verstanden, nochmal versuchen."; return null; }
    const {score, heard} = speechScore(alts, t);
    out.innerHTML = `<span class="jp">„${esc(heard)}“</span> · <b class="${score >= 0.75 ? "good" : "badtxt"}">${Math.round(score * 100)} %</b>${score < 0.75 ? " · nochmal oder weiter" : ""}`;
    return score;
  } catch (e) { out.textContent = e === "not-allowed" ? "Mikrofon ist gesperrt." : "Erkennung fehlgeschlagen (" + e + ")."; return null; }
  finally { btn.classList.remove("rec"); btn.disabled = false; }
}

// ---------- Schreiben ----------
let writeMode = "type";
RENDER.schreiben = () => {
  $("#v-schreiben").innerHTML = `
    <div class="seg" id="writeSeg" role="group" aria-label="Übung"><button data-w="type">Übersetzen</button><button data-w="build">Satzbau</button><button data-w="trace">Nachzeichnen</button></div>
    <div class="card stack" id="writeBox"></div>`;
  for (const b of document.querySelectorAll("#writeSeg button")) { b.setAttribute("aria-pressed", b.dataset.w === writeMode); b.onclick = () => { writeMode = b.dataset.w; RENDER.schreiben(); }; }
  ({type: typeNext, build: buildNext, trace: traceInit})[writeMode]();
};
let typeItem = null;
function typePool() {
  if (S.level === "anf") return VOCAB.map(([w, de]) => ({de, kana: w, show: w}));
  return PHRASES.anf.map(([t, de]) => ({de, kana: reading(t), show: t}));
}
function typeNext() {
  typeItem = wpick(typePool(), () => 1, typeItem); const it = typeItem; let hint = 0;
  $("#writeBox").innerHTML = `
    <div class="row" style="justify-content:space-between"><h3>Auf Japanisch schreiben</h3><span class="small muted">Tippe in Romaji, es wird zu Kana</span></div>
    <div style="text-align:center"><div class="mid" style="font-size:1.5rem;font-weight:700">„${esc(it.de)}“</div></div>
    <div class="drill"><div class="preview" id="tPrev" style="font-size:1.8rem;min-height:2.2rem"></div></div>
    <div class="row"><input type="text" id="tIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${S.level === "anf" ? "z. B. neko" : "z. B. arigatougozaimasu"}" style="flex:1;min-width:0"><button class="btn ai" id="tOk">Prüfen</button></div>
    <div class="row"><button class="ghost" id="tHint">Tipp</button><button class="ghost" id="tSkip">Lösung zeigen</button><span class="small muted">Lange Vokale mit Bindestrich: ko-hi- ergibt こーひー. Für ん bei Bedarf nn tippen.</span></div>
    <div class="q-fb" id="tFb"></div>`;
  const inp = $("#tIn"); inp.focus({preventScroll: true});
  inp.oninput = () => { $("#tPrev").textContent = romajiToKana(inp.value); };
  const finish = (ok, shown) => {
    $("#tFb").innerHTML = `${ok ? '<span class="good">Richtig!</span>' : shown ? "" : '<span class="badtxt">Nicht ganz.</span>'} <span class="jp" style="font-size:1.3rem">${ruby(it.show)}</span> <span class="muted">(${kanaToRomaji(it.kana)})</span>`;
    speak(plain(it.show)); if (ok) addPoints(Math.max(2, (S.level === "anf" ? 8 : 12) - hint * 2));
    inp.disabled = true; $("#tOk").textContent = "Weiter"; $("#tOk").onclick = typeNext; inp.onkeydown = null;
  };
  const check = () => { if (inp.value.trim()) finish(normJa(romajiToKana(inp.value)) === normJa(it.kana), false); };
  $("#tOk").onclick = check; inp.onkeydown = e => { if (e.key === "Enter") check(); };
  $("#tHint").onclick = () => { hint++; const k = [...it.kana.replace(/\s/g, "")]; $("#tFb").innerHTML = `<span class="muted">Fängt an mit <span class="jp">${k.slice(0, hint * 2).join("")}</span>…, ${k.length} Zeichen</span>`; };
  $("#tSkip").onclick = () => finish(false, true);
}
let buildItem = null;
function buildNext() {
  const list = SENTENCES[S.level]; buildItem = wpick(list, () => 1, buildItem); const it = buildItem;
  const parts = it[0].split("|"), answers = [it[0], ...(it[2] || [])].map(a => a.split("|").map(plain).join(""));
  let order = shuffle(parts.map((p, i) => i)); while (parts.length > 2 && order.every((v, i) => v === i)) order = shuffle(order);
  const chosen = [];
  $("#writeBox").innerHTML = `
    <div class="row" style="justify-content:space-between"><h3>Satzbau</h3><span class="small muted">Bausteine in die richtige Reihenfolge tippen</span></div>
    <div style="text-align:center;font-size:1.3rem;font-weight:700">„${esc(it[1])}“</div>
    <div class="tiles answer" id="bAns" aria-label="Dein Satz"></div>
    <div class="tiles" id="bPool">${order.map(i => `<button class="tile" data-t="${i}">${ruby(parts[i])}</button>`).join("")}</div>
    <div class="row"><button class="btn ai" id="bOk">Prüfen</button><button class="ghost" id="bReset">Zurücksetzen</button></div>
    <p class="small muted">Im Japanischen steht das Verb am Ende. Partikel wie は (Thema), を (Objekt), に (Ziel) stehen hinter dem Wort, auf das sie sich beziehen.</p>
    <div class="q-fb" id="bFb"></div>`;
  const draw = () => {
    $("#bAns").innerHTML = chosen.map((i, k) => `<button class="tile" data-c="${k}">${ruby(parts[i])}</button>`).join("");
    document.querySelectorAll("#bPool .tile").forEach(b => b.disabled = chosen.includes(+b.dataset.t));
    document.querySelectorAll("#bAns .tile").forEach(b => b.onclick = () => { chosen.splice(+b.dataset.c, 1); draw(); });
  };
  document.querySelectorAll("#bPool .tile").forEach(b => b.onclick = () => { chosen.push(+b.dataset.t); draw(); });
  $("#bReset").onclick = () => { chosen.length = 0; draw(); };
  $("#bOk").onclick = () => {
    if (chosen.length < parts.length) { $("#bFb").innerHTML = `<span class="muted">Es fehlen noch Bausteine.</span>`; return; }
    const ok = answers.includes(chosen.map(i => plain(parts[i])).join(""));
    $("#bFb").innerHTML = ok ? `<span class="good">Richtig!</span>` : `<span class="badtxt">Richtig wäre:</span> <span class="jp" style="font-size:1.2rem">${parts.map(ruby).join(" ")}</span>`;
    speak(plain(parts.join(""))); if (ok) addPoints(S.level === "anf" ? 8 : 12);
    $("#bOk").textContent = "Weiter"; $("#bOk").onclick = buildNext;
  };
}
let traceChar = "あ";
function traceInit() {
  const q = S.kq, script = q.script === "mix" ? pick(["h", "k"]) : (scriptTab === "k" ? "k" : "h");
  $("#writeBox").innerHTML = `
    <div class="row" style="justify-content:space-between"><h3>Nachzeichnen</h3><span class="small muted">Mit Finger oder Maus über die Vorlage schreiben</span></div>
    <div class="trace"><canvas id="cv" width="520" height="520" aria-label="Zeichenfläche"></canvas>
      <div class="stack" style="align-items:center;gap:10px">
        <div class="seg" id="trSeg"><button data-tr="h">ひらがな</button><button data-tr="k">カタカナ</button></div>
        <div id="trInfo" style="text-align:center"></div>
        <div class="row" style="justify-content:center"><button class="btn" id="trClear">Löschen</button><button class="btn primary" id="trDone">Geschafft</button><button class="btn" id="trNext">Anderes Zeichen</button></div>
        <p class="small muted" style="max-width:260px;text-align:center">Faustregel für die Strichfolge: von oben nach unten, von links nach rechts, waagerecht vor senkrecht.</p>
      </div></div>`;
  let trScript = script;
  const cv = $("#cv"), ctx = cv.getContext("2d");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const pickChar = () => { const it = pick(KANA.filter(x => x.g === "basic")); traceChar = trScript === "k" ? toKata(it.k) : it.k; };
  const bg = () => {
    ctx.clearRect(0, 0, 520, 520);
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(260, 20); ctx.lineTo(260, 500); ctx.moveTo(20, 260); ctx.lineTo(500, 260); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = css("--chip"); ctx.font = `600 380px ${css("--brush")}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(traceChar, 260, 280);
    $("#trInfo").innerHTML = `<span class="jp" style="font-size:2.4rem">${traceChar}</span><br><span class="muted">${kanaToRomaji(traceChar)}</span> <button class="icon" data-say="${traceChar}" aria-label="Anhören">🔊</button>`;
    for (const b of document.querySelectorAll("#trSeg button")) b.setAttribute("aria-pressed", b.dataset.tr === trScript);
  };
  const fontReady = document.fonts ? document.fonts.load(`600 40px "Klee One"`, traceChar) : Promise.resolve();
  let drawing = false, lastPt = null, strokes = 0;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 520 / r.width, (e.clientY - r.top) * 520 / r.height]; };
  cv.onpointerdown = e => { drawing = true; lastPt = pt(e); cv.setPointerCapture(e.pointerId); strokes++; };
  cv.onpointermove = e => { if (!drawing) return; const p = pt(e); ctx.strokeStyle = css("--ai"); ctx.lineWidth = 18; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(...lastPt); ctx.lineTo(...p); ctx.stroke(); lastPt = p; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  $("#trClear").onclick = () => { strokes = 0; bg(); };
  $("#trNext").onclick = () => { strokes = 0; pickChar(); bg(); };
  $("#trDone").onclick = () => { if (!strokes) { toast("Erst nachzeichnen"); return; } addPoints(3); strokes = 0; pickChar(); bg(); };
  $("#trSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; trScript = b.dataset.tr; strokes = 0; pickChar(); bg(); };
  pickChar(); bg(); fontReady.then(() => bg()).catch(() => {});
}

// ---------- Start der Seite ----------
renderStats(); setStore("local"); save();
show(location.hash.slice(1) || "start");
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v !== current && VIEWS.includes(v)) show(v); });

(async () => {
  const cfg = window.SR_CONFIG || {};
  try {
    if (!cfg.supabaseUrl || !window.supabase) return;
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    const s = await sb.auth.getSession(); user = s.data.session ? s.data.session.user : null;
    if (!user) return;
    const r = await sb.from("schach_docs").select("data").eq("user_id", user.id).eq("path", DOC + "fortschritt").maybeSingle();
    if (r.error) throw r.error;
    if (r.data && r.data.data) S = mergeState(S, r.data.data);
    save(); await pushCloud(); renderStats(); RENDER[current]();
  } catch (e) { if (user) setStore("error"); }
})();
</script>
