<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Niederländisch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="../../config.js"></script>
<script src="../ton.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="inhalte.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Niederländisch: Startseite mit Lektionen je Stufe, darunter ein Übungsablauf (eine Karte nach der anderen). Orange = Niederlande, Blau = Aktion. */
:root{
  --bg:#f6f3ee; --surface:#fff; --fg:#1b2430; --muted:#5d6876; --line:#e1dbd1; --chip:#eee8df;
  --accent:#1f4e79; --accent-fg:#fff; --orange:#e2711d; --ok:#2e7d4f; --ok-bg:#e3f2e8; --bad:#b8423f; --bad-bg:#fbe7e6; --mid:#a8740c; --mid-bg:#fbf0d9;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161d;--surface:#18202a;--fg:#e6ebf1;--muted:#98a4b3;--line:#2a3542;--chip:#222c38;--accent:#7fb2e5;--accent-fg:#0d1620;--orange:#f39a52;--ok:#62c08a;--ok-bg:#183326;--bad:#e57f7b;--bad-bg:#3a1f1e;--mid:#e0b44a;--mid-bg:#33290f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161d;--surface:#18202a;--fg:#e6ebf1;--muted:#98a4b3;--line:#2a3542;--chip:#222c38;--accent:#7fb2e5;--accent-fg:#0d1620;--orange:#f39a52;--ok:#62c08a;--ok-bg:#183326;--bad:#e57f7b;--bad-bg:#3a1f1e;--mid:#e0b44a;--mid-bg:#33290f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.back{color:var(--muted);text-decoration:none;font-size:.9rem}
.iconbtn{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:6px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.4rem)}
h2{font-size:1.3rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}

/* Kopf mit Stand */
.status{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:14px 0 18px}
.lvl b{font-family:var(--display);font-size:1.1rem}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .4s ease}
.badges{display:flex;gap:8px}
.badge{background:var(--chip);border-radius:12px;padding:6px 10px;font-weight:700;text-align:center;min-width:64px;font-size:.95rem}
.badge small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.goal{margin-bottom:18px}
.goal .bar i{background:var(--ok)}

.tabs{display:flex;gap:6px;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit}
.unit:hover{border-color:var(--accent)}
.unit .ic{font-size:1.8rem;width:42px;text-align:center}
.unit .t b{display:block}
.unit .t span{color:var(--muted);font-size:.88rem}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--chip);display:block}
.dots i.on{background:var(--ok)}
.dots i.gold{background:var(--orange)}
.extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}

/* Lektion */
.acts{display:grid;gap:10px;margin-top:14px}
.act{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:inherit}
.act:hover{border-color:var(--accent)}
.act .ic{font-size:1.5rem}
.act .t{flex:1}
.act .t span{display:block;color:var(--muted);font-size:.88rem}
.act .ok{color:var(--ok);font-weight:700}
.plist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.plist li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.plist li span{color:var(--muted);font-size:.9rem}
.say{border:0;background:var(--chip);border-radius:8px;cursor:pointer;padding:2px 8px;font-size:1rem}

/* Übungsablauf */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog .bar{flex:1;margin:0}
.prog .bar i{background:var(--accent)}
.combo{font-weight:700;color:var(--orange);min-width:3.5em;text-align:right}
.task{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.big{font-family:var(--display);font-size:clamp(1.4rem,4.6vw,1.9rem);line-height:1.3;margin:6px 0}
.de{color:var(--muted)}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:2.1rem;cursor:pointer;display:grid;place-items:center;margin:18px auto 8px;box-shadow:0 4px 14px rgba(226,113,29,.35)}
.mic.on{animation:pulse 1.1s ease-in-out infinite;background:var(--bad)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}.bar i{transition:none}}
.hint{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.5em}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.words span{padding:3px 9px;border-radius:8px;font-weight:700}
.words .y{background:var(--ok-bg);color:var(--ok)}
.words .n{background:var(--bad-bg);color:var(--bad)}
.fb{border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:700}
.fb.good{background:var(--ok-bg);color:var(--ok)}
.fb.mid{background:var(--mid-bg);color:var(--mid)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700;color:inherit}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
input.answer{width:100%;font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);margin-top:12px}
input.answer:focus{outline:none;border-color:var(--accent)}
.gapline{font-family:var(--display);font-size:1.4rem;margin:8px 0}
.gapline u{text-decoration:none;border-bottom:3px solid var(--orange);padding:0 1.5em}
.foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}

/* Dialog */
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.msg .who{font-size:.75rem;opacity:.75;font-weight:700}
.msg .tr{font-size:.85rem;opacity:.8}
.msg.cur{outline:3px solid var(--orange)}

/* Lesen */
.reader{font-size:1.15rem;line-height:1.8}
.reader span{cursor:pointer;border-radius:4px}
.reader span:hover{background:var(--chip)}
.reader span.hit{background:var(--ok-bg)}
.trans{margin-top:10px;color:var(--muted);font-style:italic}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:calc(100% - 32px);text-align:center}
.done{text-align:center}
.done .xp{font-family:var(--display);font-size:2.6rem;color:var(--orange)}
dialog{border:0;border-radius:16px;padding:20px;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;margin:12px 0 4px;font-weight:700}
dialog select{width:100%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.warn{background:var(--mid-bg);color:var(--mid);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span><a class="back" href="../">← Sprachen</a> <span class="muted">·</span> <a class="back" href="../hilfe/">🔊 Kein Ton?</a></span>
    <button class="iconbtn" id="openSettings" type="button" aria-label="Einstellungen">⚙️</button>
  </div>
  <div id="app"></div>
</div>

<dialog id="settings">
  <h2>Einstellungen</h2>
  <label for="setRate">Sprechtempo der Stimme</label>
  <select id="setRate"><option value="0.95">Normal</option><option value="0.8">Etwas langsamer</option><option value="0.65">Langsam</option></select>
  <label for="setVoice">Stimme</label>
  <select id="setVoice"></select>
  <label for="setGoal">Tagesziel</label>
  <select id="setGoal"><option value="20">Locker: 20 Punkte</option><option value="40">Normal: 40 Punkte</option><option value="80">Ehrgeizig: 80 Punkte</option></select>
  <label for="setText">Eigene Sätze im Dialog</label>
  <select id="setText"><option value="auto">Bei Anfängern zeigen, bei Fortgeschrittenen verdecken</option><option value="show">Immer zeigen</option><option value="hide">Immer verdecken</option></select>
  <p class="small muted" id="setStore"></p>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" type="button" id="closeSettings">Fertig</button></div>
</dialog>

<script>
// Niederländisch lernen: Sprechen mit Spracherkennung (Web Speech API, nl-NL), Sprachausgabe, Dialoge, Schreiben, Lesen.
// Stand im Konto der Lebensplattform (Supabase, Tabelle schach_docs, Pfad sprachen/niederlaendisch.fortschritt), dazu im Browser als Rückfall.
"use strict";
var UNITS = window.NL_UNITS || [];
var DOC = "sprachen/niederlaendisch.fortschritt";
var LEVELS = [
  [0, "Toerist"], [100, "Fietser"], [250, "Kaaskenner"], [450, "Stroopwafelfan"], [700, "Grachtenloper"],
  [1000, "Molenaar"], [1400, "Dijkwerker"], [1900, "Polderprater"], [2500, "Echte Hollander"], [3200, "Meester van de taal"]
];
var STREAK_MIN = 10; // Punkte an einem Tag, damit er für die Serie zählt
var app = document.getElementById("app");
var sb = null, user = null;

/* ---------- Stand ---------- */
var S = fresh();
function fresh() { return {xp: 0, days: {}, units: {}, weak: {}, track: "a1", settings: {rate: "0.95", voice: "", goal: "40", text: "auto"}}; }
function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayBefore(s) { var d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayWord(n) { return n + (n === 1 ? " Tag" : " Tage"); }
function level() { var i = 0; while (i + 1 < LEVELS.length && S.xp >= LEVELS[i + 1][0]) i++; return i; }
function streak() {
  var d = today(), n = 0;
  if ((S.days[d] || 0) < STREAK_MIN) d = dayBefore(d); // heute noch offen: Serie bis gestern zählt weiter
  while ((S.days[d] || 0) >= STREAK_MIN) { n++; d = dayBefore(d); }
  return n;
}
function lkey() { return "nl_state_" + (user ? user.id : "gast"); }
function saveLocal() { try { localStorage.setItem(lkey(), JSON.stringify(S)); } catch (e) {} }
function loadLocal() { try { var x = JSON.parse(localStorage.getItem(lkey()) || "null"); if (x) S = merge(fresh(), x); } catch (e) {} }
function merge(a, b) { for (var k in b) a[k] = (k === "settings") ? Object.assign(a.settings, b.settings) : b[k]; return a; }
var saveTimer = null, storeState = "lokal";
function save() {
  saveLocal();
  if (!sb || !user) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    var lv = level();
    var data = Object.assign({}, S, {punkte: S.xp, serie: streak(), stufe: lv + 1, stufeName: LEVELS[lv][1]});
    sb.from("schach_docs").upsert({user_id: user.id, path: DOC, data: data, updated_at: new Date().toISOString()}).then(function (r) { storeState = r.error ? "fehler" : "konto"; });
  }, 1200);
}
function gain(n) {
  if (!n) return;
  var before = level();
  S.xp += n; var t = today(); S.days[t] = (S.days[t] || 0) + n;
  save();
  if (level() > before) toast("🎉 Neue Stufe: " + LEVELS[level()][1] + "!");
}
function unitState(id) { return S.units[id] || (S.units[id] = {}); }
function weakKey(u, i) { return u.id + ":" + i; }
function markWeak(u, i, bad) {
  var k = weakKey(u, i);
  if (bad) S.weak[k] = (S.weak[k] || 0) + 1;
  else if (S.weak[k]) { S.weak[k]--; if (S.weak[k] <= 0) delete S.weak[k]; }
}

/* ---------- Helfer ---------- */
function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var k in attrs || {}) {
    var v = attrs[k]; if (v == null || v === false) continue;
    if (k === "text") e.textContent = v; else if (k === "class") e.className = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a, n) { return shuffle(a).slice(0, n); }
var toastTimer;
function toast(t) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var e = h("div", {class: "toast", role: "status", text: t}); document.body.appendChild(e);
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { e.remove(); }, 2600);
}

/* ---------- Text vergleichen ---------- */
var ONES = ["nul", "een", "twee", "drie", "vier", "vijf", "zes", "zeven", "acht", "negen", "tien", "elf", "twaalf", "dertien", "veertien", "vijftien", "zestien", "zeventien", "achttien", "negentien"];
var TENS = ["", "", "twintig", "dertig", "veertig", "vijftig", "zestig", "zeventig", "tachtig", "negentig"];
function numNl(n) {
  if (n < 20) return ONES[n];
  if (n < 100) { var t = Math.floor(n / 10), o = n % 10; return o ? ONES[o] + "en" + TENS[t] : TENS[t]; }
  if (n < 1000) { var hu = Math.floor(n / 100), r = n % 100; return (hu > 1 ? ONES[hu] : "") + "honderd" + (r ? numNl(r) : ""); }
  if (n < 10000) { var th = Math.floor(n / 1000), r2 = n % 1000; return (th > 1 ? ONES[th] : "") + "duizend" + (r2 ? numNl(r2) : ""); }
  return String(n);
}
function norm(s) {
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/€/g, " euro ").replace(/[’'`]/g, "").replace(/[^a-z0-9]+/g, " ")
    .replace(/\d+/g, function (d) { return " " + numNl(parseInt(d, 10)) + " "; })
    .trim().split(/\s+/).filter(Boolean);
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length, p = [], i, j;
  for (j = 0; j <= n; j++) p[j] = j;
  for (i = 1; i <= m; i++) {
    var prev = p[0]; p[0] = i;
    for (j = 1; j <= n; j++) { var tmp = p[j]; p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return p[n];
}
function near(a, b) { var L = Math.max(a.length, b.length); var allow = L <= 3 ? 0 : L <= 6 ? 1 : 2; return lev(a, b) <= allow; }
// Gesprochenes gegen Zielsatz: welche Wörter des Ziels kamen vor? Beste von mehreren Erkennungsvarianten.
function compareSpoken(target, alts) {
  var tw = norm(target), best = null;
  (alts.length ? alts : [""]).forEach(function (alt) {
    var hw = norm(alt).join(""), hws = norm(alt), used = {};
    var marks = tw.map(function (w) {
      for (var i = 0; i < hws.length; i++) if (!used[i] && near(w, hws[i])) { used[i] = 1; return {w: w, ok: true}; }
      // zusammengezogene Wörter („thuisgebleven“ vs. „thuis gebleven“)
      return {w: w, ok: w.length > 3 && hw.indexOf(w) >= 0};
    });
    var score = tw.length ? marks.filter(function (m) { return m.ok; }).length / tw.length : 0;
    if (!best || score > best.score) best = {score: score, marks: marks, heard: alt};
  });
  return best;
}
// Getippte Antwort: Abstand über den ganzen Satz
function compareTyped(target, typed) {
  var a = norm(target).join(" "), b = norm(typed).join(" ");
  var L = Math.max(a.length, 1); return Math.max(0, 1 - lev(a, b) / L);
}

/* ---------- Sprachausgabe ---------- */
var voices = [];
function loadVoices() {
  if (!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter(function (v) { return /^nl/i.test(v.lang); })
    .sort(function (a, b) { return (/nl.NL/i.test(b.lang) - /nl.NL/i.test(a.lang)) || (b.localService - a.localService); });
  fillVoiceSelect();
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function voice() { return voices.find(function (v) { return v.name === S.settings.voice; }) || voices[0] || null; }
// Sprachausgabe über ../ton.js (Browserfehler umgangen, Hinweis zur Ton-Hilfe bei fehlender Stimme); wartet bis zum Satzende
function speak(text, rate) {
  return Ton.speak(text, {lang: "nl-NL", voice: voice(), rate: rate || parseFloat(S.settings.rate) || 0.95});
}
function sayBtn(text, label) { return h("button", {class: "btn", type: "button", onclick: function () { speak(text); }, text: label || "🔊 Anhören"}); }
function slowBtn(text) { return h("button", {class: "btn ghost", type: "button", onclick: function () { speak(text, 0.6); }, text: "🐢 Langsam"}); }

/* ---------- Spracherkennung ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var activeRec = null;
// Ein Mikrofon-Knopf: tippen startet, nochmal tippen stoppt. Liefert Varianten des Gehörten an onResult.
function micButton(opts) {
  var btn = h("button", {class: "mic", type: "button", "aria-label": "Sprechen", text: "🎤"});
  var hint = h("p", {class: "hint", text: opts.hint || "Tippen und sprechen"});
  var rec = null, finals = [], alts = [], live = "";
  function stop() { if (rec) try { rec.stop(); } catch (e) {} }
  btn.addEventListener("click", function () {
    if (rec) { stop(); return; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (activeRec) try { activeRec.abort(); } catch (e) {}
    rec = new SR(); activeRec = rec;
    rec.lang = "nl-NL"; rec.interimResults = true; rec.maxAlternatives = 4; rec.continuous = !!opts.long;
    finals = []; alts = []; live = "";

  app.appendChild(h("h2", {style: "margin-top:12px", text: "🗣️ " + d.title}));
  var mine = d.roles[me === "A" ? 0 : 1], other = d.roles[me === "A" ? 1 : 0];
  app.appendChild(h("p", {class: "muted", text: mine === "Du" ? "Die Stimme spricht " + other + ", du antwortest." : "Du sprichst die Rolle „" + mine + "“, die Stimme übernimmt „" + other + "“."}));
  var chat = h("div", {class: "chat"}); app.appendChild(chat);
  var panel = h("div"); app.appendChild(panel);
  function bubble(l, mine) {
    var m = h("div", {class: "msg" + (mine ? " me" : "")}, [h("div", {class: "who", text: d.roles[l[0] === "A" ? 0 : 1]}), h("div", {class: "nl", text: l[1]}), h("div", {class: "tr", text: l[2]})]);
    chat.appendChild(m); m.scrollIntoView({block: "nearest", behavior: "smooth"}); return m;
  }
  function step(n) {
    if (run !== token) return;
    panel.textContent = "";
    if (n >= d.lines.length) return finish();
    var l = d.lines[n];
    if (l[0] !== me) {
      var b = bubble(l, false); b.classList.add("cur");
      speak(l[1]).then(function () { b.classList.remove("cur"); setTimeout(function () { step(n + 1); }, 350); });
      panel.appendChild(h("div", {class: "row"}, [h("button", {class: "btn ghost", type: "button", text: "⏭ Weiter", onclick: function () { if (window.speechSynthesis) speechSynthesis.cancel(); }})]));
      return;
    }
    var card = h("div", {class: "card"});
    card.appendChild(h("div", {class: "task", text: "Du bist dran"}));
    card.appendChild(h("p", {class: "de", text: l[2]}));
    var nl = h("p", {class: "big", text: l[1], hidden: !showText});
    card.appendChild(nl);
    card.appendChild(h("div", {class: "row"}, [
      h("button", {class: "btn ghost", type: "button", text: showText ? "Satz verdecken" : "Satz zeigen", onclick: function () { nl.hidden = !nl.hidden; this.textContent = nl.hidden ? "Satz zeigen" : "Satz verdecken"; }}),
      sayBtn(l[1], "🔊 Vorsagen")
    ]));
    var res = h("div");
    function done(score, marks) {
      res.textContent = "";
      if (marks) res.appendChild(wordMarks(marks));
      var v = verdict(score); res.appendChild(h("div", {class: "fb " + v[0], text: v[1]}));
      var pts = score >= 0.85 ? 6 : score >= 0.6 ? 3 : 1;
      res.appendChild(h("div", {class: "foot"}, [
        h("button", {class: "btn ghost", type: "button", text: "Nochmal sprechen", onclick: function () { res.textContent = ""; }}),
        h("button", {class: "btn primary", type: "button", text: "Weiter →", onclick: function () { my++; sum += score; gain(pts); bubble(l, true); step(n + 1); }})
      ]));
    }
    card.appendChild(SR ? micButton({onResult: function (alts) { var c = compareSpoken(l[1], alts); done(c.score, c.marks); }}) : selfCheck(function (s) { done(s); }));
    card.appendChild(res);
    panel.appendChild(card);
    card.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  function finish() {
    var pct = my ? sum / my : 0, bonus = pct >= 0.85 ? 15 : 8; gain(bonus);
    unitState(u.id).dialog = true; save();
    panel.appendChild(h("div", {class: "card done"}, [
      h("h2", {text: "Dialog geschafft!"}),
      h("p", {class: "muted", text: Math.round(pct * 100) + " % verstanden · Bonus +" + bonus}),
      h("div", {class: "row", style: "justify-content:center"}, [
        h("button", {class: "btn", type: "button", text: "🔄 Rollen tauschen", onclick: function () { runDialog(u, !swap); }}),
        h("button", {class: "btn", type: "button", text: "🔊 Ganzen Dialog hören", onclick: function () { playAll(d.lines.map(function (x) { return x[1]; })); }}),
        h("button", {class: "btn primary", type: "button", text: "Zur Lektion", onclick: function () { openUnit(u); }})
      ])
    ]));
  }
  step(0);
}
function playAll(lines) { var i = 0; (function next() { if (i < lines.length) speak(lines[i++]).then(function () { setTimeout(next, 250); }); })(); }

/* ---------- Lesetext ---------- */
function runRead(u) {
  stopAll(); window.scrollTo(0, 0);
  var t = u.text, sentences = t.nl.match(/[^.!?]+[.!?]+/g) || [t.nl];
  app.textContent = "";
  app.appendChild(h("button", {class: "btn ghost", type: "button", text: "← Lektion", onclick: function () { openUnit(u); }}));
  app.appendChild(h("h2", {style: "margin-top:12px", text: "📖 " + t.title}));
  app.appendChild(h("p", {class: "small muted", text: "Tippe auf einen Satz, um ihn zu hören."}));
  var reader = h("div", {class: "card reader", lang: "nl"});
  var spans = sentences.map(function (s) { var e = h("span", {text: s.trim() + " ", onclick: function () { speak(s.trim()); }}); reader.appendChild(e); return e; });
  app.appendChild(reader);
  var tr = h("p", {class: "trans", text: t.de, hidden: true});
  app.appendChild(h("div", {class: "row", style: "margin-top:12px"}, [
    h("button", {class: "btn", type: "button", text: "🔊 Ganzen Text hören", onclick: function () { playAll(sentences.map(function (s) { return s.trim(); })); }}),
    h("button", {class: "btn ghost", type: "button", text: "Übersetzung zeigen", onclick: function () { tr.hidden = !tr.hidden; this.textContent = tr.hidden ? "Übersetzung zeigen" : "Übersetzung verbergen"; }})
  ]));
  app.appendChild(tr);

  // Laut vorlesen: Abdeckung der Wörter des ganzen Textes
  var aloud = h("div", {class: "card", style: "margin-top:16px"}, [h("div", {class: "task", text: "Laut vorlesen"}), h("p", {class: "muted", text: "Lies den ganzen Text laut. Tippe zum Beenden auf den Knopf."})]);
  var aRes = h("div"), aDone = false;
  if (SR) aloud.appendChild(micButton({long: true, hint: "Tippen und vorlesen", onResult: function (alts) {
    var c = compareSpoken(t.nl, alts); aRes.textContent = "";
    // Sätze markieren, die gut gelesen wurden
    var pos = 0; spans.forEach(function (sp, k) { var n = norm(sentences[k]).length, seg = c.marks.slice(pos, pos + n); pos += n; sp.classList.toggle("hit", seg.filter(function (m) { return m.ok; }).length / Math.max(1, n) >= 0.7); });
    var v = verdict(c.score); aRes.appendChild(h("div", {class: "fb " + v[0], text: Math.round(c.score * 100) + " % der Wörter erkannt"}));
    if (!aDone) { aDone = true; var pts = Math.round(c.score * 15); gain(pts); aRes.appendChild(h("p", {class: "muted", text: "+" + pts + " Punkte"})); }
  }}));
  else aloud.appendChild(h("p", {class: "hint", text: "Ohne Spracherkennung: Lies laut mit und vergleiche mit der Stimme."}));
  aloud.appendChild(aRes);
  app.appendChild(aloud);

  var qbox = h("div", {class: "card", style: "margin-top:16px"}, [h("div", {class: "task", text: "Fragen zum Text"})]);
  var answered = 0, right = 0;
  t.questions.forEach(function (q) {
    qbox.appendChild(h("p", {style: "font-weight:700;margin:14px 0 0", lang: "nl", text: q[0]}));
    choiceList(qbox, shuffle(q[1]), q[1][0], function (ok) {
      answered++; if (ok) { right++; gain(5); }
      if (answered === t.questions.length) {
        unitState(u.id).read = true; save();
        qbox.appendChild(h("div", {class: "fb " + (right === answered ? "good" : "mid"), text: right + " von " + answered + " richtig" + (right === answered ? " 🎉" : "")}));
        qbox.appendChild(h("div", {class: "row"}, [h("button", {class: "btn primary", type: "button", text: "Zur Lektion", onclick: function () { openUnit(u); }})]));
      }
    });
  });
  app.appendChild(qbox);
}

/* ---------- Freies Sprechen ---------- */
function runSpeak(u, k) {
  stopAll(); window.scrollTo(0, 0);
  var s = u.speak[k];
  app.textContent = "";
  app.appendChild(h("button", {class: "btn ghost", type: "button", text: "← Lektion", onclick: function () { openUnit(u); }}));
  var card = h("div", {class: "card", style: "margin-top:12px"});
  card.appendChild(h("div", {class: "task", text: "Freies Sprechen · " + (k + 1) + " von " + u.speak.length}));
  card.appendChild(h("p", {class: "big", lang: "nl", text: s[0]}));
  card.appendChild(h("p", {class: "de", text: s[1]}));
  card.appendChild(h("div", {class: "row"}, [sayBtn(s[0], "🔊 Aufgabe hören")]));
  card.appendChild(h("p", {class: "small muted", text: "Antworte in drei bis fünf Sätzen. Fehler sind erlaubt, Hauptsache du sprichst."}));
  var res = h("div"), got = false;
  var model = h("div", {hidden: true}, [h("div", {class: "task", style: "margin-top:14px", text: "Beispielantwort"}), h("p", {lang: "nl", text: s[2]}), h("div", {class: "row"}, [sayBtn(s[2], "🔊 Beispiel hören")])]);
  if (SR) card.appendChild(micButton({long: true, hint: "Tippen, antworten, zum Beenden nochmal tippen", onResult: function (alts) {
    var text = alts[0].trim(), n = norm(text).length;
    res.textContent = "";
    res.appendChild(h("p", {}, [h("b", {text: "Erkannt: "}), document.createTextNode("„" + text + "“")]));
    var cls = n >= 25 ? "good" : n >= 12 ? "mid" : "bad";
    res.appendChild(h("div", {class: "fb " + cls, text: n + " Wörter" + (n >= 25 ? " · stark! 💪" : n >= 12 ? " · gut, versuch noch einen Satz mehr" : " · versuch es etwas ausführlicher")}));
    if (!got) { got = true; var pts = n >= 25 ? 25 : n >= 12 ? 15 : 5; gain(pts); res.appendChild(h("p", {class: "muted", text: "+" + pts + " Punkte"})); }
    model.hidden = false;
  }}));
  else card.appendChild(h("p", {class: "hint", text: "Ohne Spracherkennung: Sprich deine Antwort laut und vergleiche mit der Beispielantwort."}));
  card.appendChild(res);
  card.appendChild(h("div", {class: "row"}, [h("button", {class: "btn ghost", type: "button", text: "Beispielantwort zeigen", onclick: function () { model.hidden = false; this.remove(); }})]));
  card.appendChild(model);
  var last = k + 1 >= u.speak.length;
  card.appendChild(h("div", {class: "foot"}, [h("span"), h("button", {class: "btn primary", type: "button", text: last ? "Fertig" : "Nächste Aufgabe →", onclick: function () {
    if (last) { unitState(u.id).speak = true; save(); openUnit(u); } else runSpeak(u, k + 1);
  }})]));
  app.appendChild(card);
}

/* ---------- Einstellungen ---------- */
var dlg = document.getElementById("settings");
function fillVoiceSelect() {
  var sel = document.getElementById("setVoice"); sel.textContent = "";
  if (!voices.length) { sel.appendChild(h("option", {value: "", text: "Keine niederländische Stimme gefunden"})); return; }
  voices.forEach(function (v) { sel.appendChild(h("option", {value: v.name, text: v.name + " (" + v.lang + ")"})); });
  sel.value = voice() ? voice().name : "";
}
document.getElementById("openSettings").addEventListener("click", function () {
  ["rate", "goal", "text"].forEach(function (k) { document.getElementById("set" + k[0].toUpperCase() + k.slice(1)).value = S.settings[k]; });
  fillVoiceSelect();
  document.getElementById("setStore").textContent = user ? (storeState === "fehler" ? "Speichern im Konto klappt gerade nicht; der Stand liegt im Browser." : "Dein Stand wird in deinem Konto gespeichert, auf Handy und Rechner gleich.") : "Nicht angemeldet: Der Stand liegt nur in diesem Browser. Melde dich im Portal an, um ihn zu sichern.";
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
});
document.getElementById("closeSettings").addEventListener("click", function () {
  S.settings.rate = document.getElementById("setRate").value;
  S.settings.goal = document.getElementById("setGoal").value;
  S.settings.text = document.getElementById("setText").value;
  S.settings.voice = document.getElementById("setVoice").value;
  save(); if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
  if (!run) home();
  speak("Goedendag! Zo klink ik nu.");
});

/* ---------- Start ---------- */
(async function () {
  var cfg = window.SR_CONFIG || {};
  try {
    if (!cfg.supabaseUrl || !window.supabase) throw new Error("ohne Konfiguration");
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var s = await sb.auth.getSession();
    user = s.data.session ? s.data.session.user : null;
  } catch (e) { user = null; }
  loadLocal(); home();
  if (!user) return;
  try {
    var r = await sb.from("schach_docs").select("data").eq("user_id", user.id).eq("path", DOC).maybeSingle();
    if (r.error) throw r.error;
    var d = r.data && r.data.data;
    // Mehr Punkte gewinnt: so geht weder Handy- noch Rechnerstand verloren
    if (d && (d.xp || 0) > S.xp) { var keep = S.settings; S = merge(fresh(), d); S.settings = Object.assign(keep, d.settings || {}); ["punkte", "serie", "stufe", "stufeName"].forEach(function (k) { delete S[k]; }); saveLocal(); if (!run) home(); }
    else if (S.xp > ((d && d.xp) || 0)) save();
    storeState = "konto";
  } catch (e) { storeState = "fehler"; }
})();
</script>
