<title>Ralfs Lesetraining</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one calm column like a reading desk; a highlighter-yellow marker is the only loud element (it is the pacer). */
:root{
  --paper:#f5f7fa; --card:#ffffff; --ink:#1a2130; --muted:#5a6475; --line:#dbe1ea;
  --accent:#2f5bd3; --accent-ink:#ffffff; --marker:#ffe04a; --marker-soft:rgba(255,224,74,.45);
  --good:#1d7f47; --bad:#b4372c; --warn:#9a5d00; --s2:#b8730a; --shade:rgba(26,33,48,.06);
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f131b; --card:#171d29; --ink:#e5e9f0; --muted:#9aa4b5; --line:#283244;
  --accent:#6a90f0; --accent-ink:#0f131b; --marker:#d9b829; --marker-soft:rgba(232,196,40,.30);
  --good:#4cc283; --bad:#ee7a6e; --warn:#e2a64a; --s2:#c4851c; --shade:rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f131b; --card:#171d29; --ink:#e5e9f0; --muted:#9aa4b5; --line:#283244;
  --accent:#6a90f0; --accent-ink:#0f131b; --marker:#d9b829; --marker-soft:rgba(232,196,40,.30);
  --good:#4cc283; --bad:#ee7a6e; --warn:#e2a64a; --s2:#c4851c; --shade:rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--f-read);font-weight:600;font-size:1.5rem;margin:0;text-wrap:balance;line-height:1.2}
.brand h1 .mk{background:linear-gradient(transparent 55%,var(--marker-soft) 55%);padding:0 2px}
.brand small{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;background:var(--card);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-weight:700}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
nav.tabs button.drag{background:var(--shade);transform:scale(1.08);box-shadow:0 4px 14px var(--shade);cursor:grabbing;position:relative;z-index:1}
nav.tabs.dragging button{cursor:grabbing}
nav.tabs button{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px 9px 9px;font:inherit;color:var(--muted);cursor:grab;white-space:nowrap}
nav.tabs button::before{content:"";width:8px;height:15px;flex:none;opacity:.6;background:radial-gradient(circle,currentColor 1.2px,transparent 1.6px) 0 0/4px 5px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
button{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;font-size:1rem;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2,.card h3{margin:0;font-family:var(--f-read);font-weight:600;text-wrap:balance;line-height:1.25}
.card h2{font-size:1.35rem}.card h3{font-size:1.1rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.prose{font-family:var(--f-read);font-size:1.02rem;line-height:1.6;max-width:65ch}
.prose p{margin:0 0 .7em}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:baseline}
.steps .dot{width:1.6em;height:1.6em;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;flex:none;font-variant-numeric:tabular-nums}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:var(--card)}
.steps li.now .dot{background:var(--marker);border-color:var(--marker);color:#1a2130;font-weight:700}
.notice{border-left:4px solid var(--warn);padding:8px 12px;background:var(--shade);border-radius:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.stat .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted)}
.stat .d{font-size:.8rem;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.weeks{display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.week .pips{display:flex;gap:5px}
.pip{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.pip.done{background:var(--good);border-color:var(--good)}
.pip.test{border-color:var(--accent);border-width:2px}
.pip.next{background:var(--marker);border-color:var(--marker)}
.week .wt{font-weight:700}.week .wg{grid-column:1/-1;color:var(--muted);font-size:.9rem}
.lvl{height:10px;border-radius:5px;background:var(--shade);overflow:hidden}
.lvl i{display:block;height:100%;background:var(--accent);border-radius:5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.badge.on{border-style:solid;opacity:1;background:linear-gradient(transparent 70%,var(--marker-soft) 70%)}
.badge b{font-size:.95rem}.badge span{font-size:.8rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;box-shadow:0 4px 14px var(--shade);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.t-axis{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.t-lab{fill:var(--ink);font-size:12px;font-family:var(--f-ui);font-weight:700}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
select,input[type=range]{font:inherit}
select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
input[type=range]{width:100%;accent-color:var(--accent)}
/* Quiz */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
/* Schulte */
.schulte{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:420px;width:100%;margin:0 auto;position:relative}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.3rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.hit{background:var(--shade);color:var(--muted)}
.cell.miss{border-color:var(--bad)}
.center-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:var(--bad);transform:translate(-50%,-50%);pointer-events:none}
/* Span */
.flash{height:140px;display:flex;align-items:center;justify-content:center;font-family:var(--f-read);font-size:1.6rem;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center;padding:0 12px}
/* Reader window */
#reader{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column}
#reader .rbar{display:flex;align-items:center;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card)}
#reader .rbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#reader .rbar .btn{min-height:40px;padding:6px 12px}
.wpm{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5em;text-align:center}
#rscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#rtext{position:relative;max-width:36em;margin:0 auto;padding:32px max(18px,env(safe-area-inset-right,0px)) 45vh max(18px,env(safe-area-inset-left,0px));font-family:var(--f-read);font-size:var(--rsize,1.25rem);line-height:1.75}
#rtext p{margin:0 0 1em;position:relative;z-index:1}
#rtext .w{position:relative;z-index:1}
#rtext.blur p{filter:blur(6px);user-select:none}
#rtext.dim .w{color:var(--muted)}
#rtext.dim .w.on{color:var(--ink)}
#rtext.skim p{color:var(--muted)}
#rtext.skim .lead{color:var(--ink);font-weight:600}
#rmark{position:absolute;left:0;height:0;background:var(--marker-soft);border-bottom:3px solid var(--marker);border-radius:3px;z-index:0;pointer-events:none}
#rsvp{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-read);font-size:calc(var(--rsize,1.25rem) * 1.8);padding:0 16px;text-align:center}
#rsvp span{border-bottom:3px solid var(--marker);padding:0 6px}
#reader .rfoot{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
#reader .rfoot .prog{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--shade);overflow:hidden}
#reader .rfoot .prog i{display:block;height:100%;width:0;background:var(--accent)}
#rclock{font-variant-numeric:tabular-nums;color:var(--muted);min-width:3.5em}
@media (max-width:480px){#rfull{display:none}#reader .rbar{flex-wrap:nowrap;gap:4px}#reader .rbar .btn{padding:6px 9px}.wpm{min-width:4.6em;font-size:.9rem}}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);vertical-align:middle}
.pref{display:flex;flex-direction:column;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.swatch i{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent)}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px;cursor:pointer}
input[type=text].txt{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;min-height:44px;width:100%}
.tabrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center}
.tabrow .btn{min-height:40px;padding:6px 12px}
.tabrow label{display:flex;gap:6px;align-items:center;font-size:.9rem;white-space:nowrap}
.side{display:none}
.side .pips{display:flex;gap:5px}
.side .card{padding:14px;gap:8px}
.side h3{margin:0}
.side .tip{font-family:var(--f-read);font-size:.92rem;line-height:1.5;margin:0}
@media (min-width:1180px){
  .wrap{max-width:1400px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,760px) minmax(220px,1fr);column-gap:28px;row-gap:16px;align-content:start}
  .wrap>header,.wrap>nav,.wrap>main,.wrap>#syncnote{grid-column:2}
  .wrap>.side{display:flex;flex-direction:column;gap:12px;grid-row:1/span 4;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:none}
  .wrap>#sideL{grid-column:1}.wrap>#sideR{grid-column:3}
  body.noside .wrap>.side{display:none}
  body.noside .wrap{display:flex;max-width:760px}
}
.arr{position:relative}
.arr>h2,.arr>h3,.arr>.eyebrow{padding-right:38px}
.cgrip{position:absolute;top:8px;right:8px;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;-webkit-user-select:none;user-select:none}
.cgrip::before{content:"";width:10px;height:16px;opacity:.7;background:radial-gradient(circle,currentColor 1.3px,transparent 1.7px) 0 0/5px 5px}
.cgrip:hover{border-color:var(--accent)}
.cgrip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.arr.carrying{outline:2px dashed var(--accent);outline-offset:3px;box-shadow:0 8px 24px var(--shade);z-index:2}
body.carrying .side{min-height:90px;outline:2px dashed var(--line);outline-offset:-2px;border-radius:12px}
body.carrying,body.carrying *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.tchip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.tchip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 15%,var(--card));border-color:var(--accent);font-weight:700}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
details.tg{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
details.tg summary{cursor:pointer;font-weight:700;padding:4px 0;display:flex;align-items:center;gap:8px}
details.tg summary .tl{flex:1}
.tgrip{flex:none;width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;-webkit-user-select:none;user-select:none}
.tgrip::before{content:"";width:10px;height:16px;opacity:.7;background:radial-gradient(circle,currentColor 1.3px,transparent 1.7px) 0 0/5px 5px}
.tgrip:hover{border-color:var(--accent)}
.tgrip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details.tg.carrying{outline:2px dashed var(--accent);outline-offset:3px;box-shadow:0 8px 24px var(--shade)}
.tgs{display:flex;flex-direction:column;gap:12px}
details.tg.own{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.tchip .x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:8px;border-radius:50%;background:color-mix(in srgb,var(--ink) 14%,transparent);font-size:.7rem;line-height:1;vertical-align:middle}
.tchip:hover .x{background:var(--accent);color:var(--paper)}
.thint{margin:6px 0 2px;font-size:.8rem}
details.tg .tchips{padding:6px 0 4px}
textarea.own{width:100%;min-height:140px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.big{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1 id="brand-h">Ralfs <span class="mk">Lesetraining</span></h1><small id="brand-s">8 Wochen schneller lesen, ohne Verständnis zu verlieren</small></div>
    <div class="chips" id="chips"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
  <p class="muted" id="syncnote" style="font-size:.8rem;margin:0"></p>
  <aside class="side" id="sideL" aria-label="Dein Kurs"></aside>
  <aside class="side" id="sideR" aria-label="Tempo, Tipp und Themen"></aside>
</div>

<div id="reader" hidden>
  <div class="rbar">
    <button class="btn ghost" id="rclose" aria-label="Lesefenster schließen">✕</button>
    <span class="grow" id="rtitle"></span>
    <button class="btn ghost" id="rslow" aria-label="Langsamer">−</button>
    <span class="wpm" id="rwpm"></span>
    <button class="btn ghost" id="rfast" aria-label="Schneller">+</button>
    <button class="btn ghost" id="rsmall" aria-label="Schrift kleiner">A−</button>
    <button class="btn ghost" id="rbig" aria-label="Schrift größer">A+</button>
    <button class="btn ghost" id="rfull" aria-label="Vollbild">⛶</button>
  </div>
  <div id="rscroll"><div id="rtext"><div id="rmark"></div></div></div>
  <div id="rsvp" hidden><span></span></div>
  <div class="rfoot">
    <span id="rclock">0:00</span>
    <div class="prog"><i id="rprog"></i></div>
    <button class="btn" id="rpause">Pause</button>
    <button class="btn primary" id="rgo">Start</button>
  </div>
</div>

<script>
"use strict";
/* ============ TEXTE ============ */
const TEXTS = [
{id:"T1",kind:"test",title:"Der Hamburger Hafen",paras:[
"Der Hamburger Hafen liegt nicht am Meer. Bis zur Nordsee sind es auf der Elbe rund hundert Kilometer, und trotzdem ist er der größte Seehafen Deutschlands und einer der wichtigsten Containerhäfen Europas. Möglich macht das die Tide: Zweimal am Tag steigt und fällt das Wasser auch in Hamburg um mehrere Meter. Große Schiffe nutzen das auflaufende Wasser, um sicher die Elbe hinaufzufahren.",
"Jedes Jahr im Mai feiert die Stadt den Hafengeburtstag. Er erinnert an einen Freibrief, den Kaiser Friedrich Barbarossa am 7. Mai 1189 ausgestellt haben soll. Darin erhielten die Hamburger das Recht, ihre Waren zollfrei die Elbe hinab bis zur Mündung zu bringen. Historiker halten die erhaltene Urkunde allerdings für eine Fälschung aus späterer Zeit. Gefeiert wird trotzdem, mit Schiffsparaden, Feuerwerk und Hunderttausenden Besuchern.",
"Wie sehr der Hafen die Stadt geprägt hat, zeigt die Speicherstadt. Ab 1883 entstand auf Eichenpfählen ein Viertel aus roten Backsteinspeichern, in denen Kaffee, Tee, Gewürze und Teppiche lagerten. Für den Bau mussten rund zwanzigtausend Menschen ihre Wohnungen verlassen. Seit 2015 gehört die Speicherstadt zusammen mit dem benachbarten Kontorhausviertel zum Welterbe der UNESCO.",
"Heute bestimmen Container das Bild. Statt Säcke von Hand zu schleppen, heben riesige Brücken die genormten Stahlkisten von den Schiffen, oft automatisch gesteuert. Pro Jahr werden in Hamburg Millionen Standardcontainer umgeschlagen. Die Schiffe sind dabei immer größer geworden, die größten sind fast vierhundert Meter lang. Deshalb wurde die Elbe mehrfach vertieft, zuletzt in einem jahrelang umstrittenen Projekt, gegen das Umweltverbände vor Gericht gezogen waren.",
"Der Hafen steht damit vor einer Daueraufgabe: Er muss mit Häfen wie Rotterdam und Antwerpen mithalten, die näher am offenen Meer liegen. Gleichzeitig soll er leiser, sauberer und klimafreundlicher werden. Landstrom für Kreuzfahrtschiffe, Wasserstoffprojekte und mehr Güterverkehr auf der Schiene sind Teil dieser Strategie. Ob das reicht, wird sich in den kommenden Jahrzehnten zeigen."],

{id:"T2",kind:"test",title:"Wie das Auge liest",paras:[
"Beim Lesen haben wir das Gefühl, dass unser Blick gleichmäßig über die Zeile gleitet. Das stimmt nicht. Das Auge bewegt sich in kleinen Sprüngen, den Sakkaden, und hält dazwischen kurz an. Diese Haltepunkte heißen Fixationen und dauern meist etwa eine Viertelsekunde. Nur während der Fixationen nimmt das Auge Informationen auf, während der Sprünge ist es praktisch blind.",
"Scharf sehen wir nur in einem winzigen Bereich in der Mitte des Blickfelds, der Fovea. Pro Fixation erkennen wir deshalb nur wenige Buchstaben wirklich deutlich. Was weiter außen liegt, nehmen wir lediglich verschwommen wahr: die Länge des nächsten Wortes, Lücken, vielleicht einen Großbuchstaben. Diese Vorschau hilft dem Gehirn zu planen, wohin der nächste Sprung gehen soll. Kurze, häufige Wörter wie „und“ oder „der“ werden dabei oft einfach übersprungen.",
"Etwa jeder zehnte Sprung geht zurück. Solche Rücksprünge, Regressionen genannt, sind kein Zeichen von Schwäche. Sie passieren, wenn ein Satz anders weitergeht als erwartet oder ein Wort nicht sofort verstanden wurde. Versuche haben gezeigt: Wer am Zurückspringen gehindert wird, versteht schwierige Sätze schlechter.",
"Daraus folgt eine unbequeme Erkenntnis für viele Schnelllese-Versprechen. Der Engpass beim Lesen sind nicht die Augen, sondern die Sprachverarbeitung im Gehirn. Die Augenbewegungen machen nur einen kleinen Teil der Lesezeit aus. Wer Wörter schneller sieht, versteht sie deshalb nicht automatisch schneller. Methoden, die versprechen, ganze Seiten auf einen Blick zu erfassen, halten Messungen nicht stand.",
"Was hilft dann? Vor allem Übung und Wissen. Wer viele Wörter kennt und mit einem Thema vertraut ist, erkennt Zusammenhänge schneller und muss seltener zurückspringen. Ein Zeiger, etwa ein Finger oder ein Stift unter der Zeile, kann zusätzlich helfen, den Blick ruhig zu führen und unnötiges Abschweifen zu vermeiden. Und wer gezielt überfliegt, also nur Überschriften, Anfänge und Schlüsselwörter liest, verschafft sich schnell einen Überblick. Er sollte nur wissen, dass er dabei Details verpasst."],
qs:[
{q:"Wann nimmt das Auge Informationen auf?",a:["Während der Fixationen","Während der Sprünge","Gleichmäßig beim Gleiten über die Zeile"]},
{q:"Wie heißt der Bereich, in dem wir scharf sehen?",a:["Fovea","Sakkade","Regression"]},
{q:"Wie oft springt der Blick ungefähr zurück?",a:["Etwa bei jedem zehnten Sprung","Bei jedem zweiten Sprung","Praktisch nie"]},
{q:"Was ist laut Text der eigentliche Engpass beim Lesen?",a:["Die Sprachverarbeitung im Gehirn","Die Augenmuskeln","Die Beleuchtung"]},
{q:"Was passiert, wenn man Rücksprünge verhindert?",a:["Schwierige Sätze werden schlechter verstanden","Man liest doppelt so schnell bei gleichem Verständnis","Es ändert sich nichts"]}]},

{id:"T3",kind:"test",title:"Doppelbesteuerungsabkommen",paras:[
"Wer in mehreren Staaten Einkünfte erzielt, gerät schnell in eine Zwickmühle. Der Wohnsitzstaat möchte das gesamte Einkommen besteuern, egal wo es verdient wurde. Der Staat, in dem das Geld erwirtschaftet wird, der sogenannte Quellenstaat, will ebenfalls seinen Anteil. Ohne Regeln würde dasselbe Einkommen zweimal besteuert. Genau das sollen Doppelbesteuerungsabkommen verhindern.",
"Diese Abkommen sind völkerrechtliche Verträge zwischen zwei Staaten. Deutschland hat mit fast hundert Staaten solche Verträge geschlossen. Die meisten folgen in Aufbau und Wortlaut einem Vorbild: dem Musterabkommen der OECD. Es wird regelmäßig überarbeitet, und sein Kommentar dient Gerichten und Finanzverwaltungen als wichtige Auslegungshilfe.",
"Ein Abkommen schafft keine neuen Steuern. Es verteilt nur das Recht zu besteuern. Für jede Einkunftsart legt es fest, welcher Staat zugreifen darf. Unternehmensgewinne etwa darf der Quellenstaat in der Regel nur besteuern, wenn das Unternehmen dort eine Betriebsstätte unterhält, also eine feste Geschäftseinrichtung wie ein Büro oder eine Fabrik. Bei Arbeitslohn kommt es oft darauf an, wo die Arbeit tatsächlich ausgeübt wird und wie lange sich jemand im anderen Staat aufhält.",
"Darf der Quellenstaat besteuern, muss der Wohnsitzstaat die doppelte Belastung vermeiden. Dafür gibt es zwei Wege. Bei der Freistellungsmethode bleiben die ausländischen Einkünfte im Wohnsitzstaat steuerfrei. In Deutschland erhöhen sie aber oft über den Progressionsvorbehalt den Steuersatz auf das übrige Einkommen. Bei der Anrechnungsmethode werden die Einkünfte auch im Wohnsitzstaat erfasst, die im Ausland gezahlte Steuer wird jedoch auf die heimische Steuer angerechnet.",
"Abkommen können auch missbraucht werden, etwa wenn Firmen nur zum Schein in einem günstigen Vertragsstaat sitzen. Viele Staaten haben deshalb Regeln gegen solche Gestaltungen eingeführt. Für die Praxis heißt das: Wer grenzüberschreitend arbeitet, muss stets das nationale Recht und das jeweilige Abkommen zusammen lesen."],
qs:[
{q:"Was ist der Quellenstaat?",a:["Der Staat, in dem das Einkommen erwirtschaftet wird","Der Staat, in dem man wohnt","Der Sitzstaat der OECD"]},
{q:"Woran orientieren sich die meisten Abkommen?",a:["Am Musterabkommen der OECD","An einer EU-Richtlinie","An der Charta der Vereinten Nationen"]},
{q:"Was tut ein Abkommen laut Text nicht?",a:["Neue Steuern schaffen","Das Besteuerungsrecht verteilen","Regeln je Einkunftsart festlegen"]},
{q:"Wann darf der Quellenstaat Unternehmensgewinne in der Regel besteuern?",a:["Wenn dort eine Betriebsstätte besteht","Immer, sobald dort ein Kunde sitzt","Nie"]},
{q:"Was passiert bei der Anrechnungsmethode?",a:["Die ausländische Steuer wird auf die heimische angerechnet","Die ausländischen Einkünfte bleiben steuerfrei","Die Steuer wird in beiden Staaten voll gezahlt"]}]},

{id:"T4",kind:"test",title:"Schlaf und Gedächtnis",paras:[
"Lange galt Schlaf als eine Art Pause, in der der Körper einfach abschaltet. Heute weiß man: Das Gehirn ist nachts sehr beschäftigt. Ein großer Teil dieser Arbeit dient dem Gedächtnis.",
"Der Schlaf durchläuft in der Nacht mehrere Zyklen von jeweils etwa neunzig Minuten. Jeder Zyklus besteht aus leichtem Schlaf, Tiefschlaf und REM-Schlaf, benannt nach den schnellen Augenbewegungen, die in dieser Phase auftreten. Zu Beginn der Nacht ist der Anteil an Tiefschlaf hoch, gegen Morgen nehmen die REM-Phasen zu.",
"Im Tiefschlaf spielt das Gehirn offenbar Erlebnisse des Tages erneut ab. Messungen bei Ratten zeigten, dass Nervenzellen, die beim Durchlaufen eines Labyrinths aktiv waren, im Schlaf in ähnlicher Reihenfolge feuerten. Beim Menschen gilt der Tiefschlaf als besonders wichtig, um Fakten und Ereignisse vom Hippocampus, einer Art Zwischenspeicher, in die Großhirnrinde zu übertragen. Dort werden sie dauerhaft abgelegt.",
"Der REM-Schlaf scheint stärker mit Gefühlen und kreativen Verknüpfungen zu tun zu haben. In einem Experiment fanden Versuchspersonen nach einer Nacht mit ausreichend Schlaf deutlich häufiger eine versteckte Abkürzung in einer Rechenaufgabe als nach einer durchwachten Nacht.",
"Umgekehrt schadet Schlafmangel dem Lernen deutlich. Wer zu wenig schläft, kann sich am nächsten Tag schlechter konzentrieren und nimmt neue Informationen schlechter auf. Auch Alkohol am Abend stört den Aufbau des Schlafs, vor allem den REM-Schlaf.",
"Für das Lernen ergibt sich daraus ein einfacher Rat: Lieber über mehrere Tage verteilt üben und dazwischen gut schlafen, als in einer langen Nacht alles auf einmal zu pauken. Schon ein kurzer Mittagsschlaf kann helfen, Gelerntes zu festigen. Wer also abends noch eine Lektion liest, gibt seinem Gehirn über Nacht die Gelegenheit, sie zu verarbeiten."],
qs:[
{q:"Wie lange dauert ein Schlafzyklus ungefähr?",a:["Etwa neunzig Minuten","Etwa dreißig Minuten","Etwa drei Stunden"]},
{q:"Wann ist der Anteil an Tiefschlaf hoch?",a:["Zu Beginn der Nacht","Gegen Morgen","Gleichmäßig über die Nacht"]},
{q:"Welche Rolle hat der Hippocampus laut Text?",a:["Er ist eine Art Zwischenspeicher","Er erzeugt die Träume","Er steuert die Augenbewegungen"]},
{q:"Was fanden ausgeschlafene Versuchspersonen häufiger?",a:["Eine versteckte Abkürzung in einer Rechenaufgabe","Den Ausgang eines Labyrinths","Mehr Vokabeln einer Fremdsprache"]},
{q:"Welcher Lernrat folgt aus dem Text?",a:["Verteilt üben und dazwischen gut schlafen","Vor Prüfungen eine Nacht durchlernen","Nur morgens lernen"]}]},

{id:"T5",kind:"test",title:"Die Erfindung des Buchdrucks",paras:[
"Um 1450 entwickelte Johannes Gutenberg in Mainz ein Verfahren, das die Welt verändern sollte. Gedruckt wurde zwar schon vorher, in China und Korea sogar mit beweglichen Zeichen. Gutenberg aber verband mehrere Erfindungen zu einem System, das schnell, genau und in großer Menge arbeitete.",
"Herzstück war ein Handgießinstrument. Damit ließen sich einzelne Buchstaben aus einer Legierung aus Blei, Zinn und Antimon in großer Zahl gießen, alle exakt gleich hoch. Setzer reihten diese Lettern zu Zeilen und Seiten, die nach dem Druck wieder zerlegt und neu verwendet wurden. Dazu kamen eine ölhaltige Druckfarbe, die auf Metall haftete, und eine Presse nach dem Vorbild von Weinpressen.",
"Das bekannteste Werk ist die Gutenberg-Bibel, die um 1454 fertig wurde. Sie umfasst rund 1.280 Seiten in zwei Bänden. Von den vermutlich etwa 180 Exemplaren sind heute noch 49 ganz oder teilweise erhalten. Gutenberg selbst wurde nicht reich. Ein Rechtsstreit mit seinem Geldgeber Johannes Fust kostete ihn einen Teil seiner Werkstatt.",
"Die Technik verbreitete sich dennoch rasant. Um 1500 gab es in Europa schon in über 250 Orten Druckereien, und Millionen Bücher waren gedruckt. Bücher wurden billiger, und Wissen war nicht länger an wenige Klosterbibliotheken gebunden. Martin Luther nutzte ab 1517 Flugschriften, um seine Ideen in kurzer Zeit im ganzen Reich zu verbreiten. Ohne den Buchdruck wäre die Reformation kaum so schnell vorangekommen.",
"Auch die Sprache veränderte sich. Weil Drucker möglichst viele Leser erreichen wollten, setzten sich einheitlichere Schreibweisen durch. Und mit mehr Büchern stieg langsam auch die Zahl der Menschen, die lesen konnten. Viele Historiker vergleichen die Folgen des Buchdrucks deshalb mit denen des Internets: Eine neue Technik machte Informationen plötzlich für sehr viele Menschen zugänglich und veränderte Religion, Politik und Wissenschaft."],
qs:[
{q:"Wo entwickelte Gutenberg sein Verfahren?",a:["In Mainz","In Köln","In Wittenberg"]},
{q:"Was war das Herzstück seiner Erfindung?",a:["Ein Handgießinstrument für Lettern","Eine neue Papiermühle","Der Holzschnitt"]},
{q:"Wie viele Exemplare der Gutenberg-Bibel sind erhalten?",a:["49","180","1.280"]},
{q:"Wer nutzte ab 1517 Flugschriften?",a:["Martin Luther","Johannes Fust","Johannes Gutenberg"]},
{q:"Womit vergleichen Historiker die Folgen des Buchdrucks?",a:["Mit denen des Internets","Mit denen der Dampfmaschine","Mit denen des Telefons"]}]},

{id:"A",kind:"train",title:"Eine kurze Geschichte des Kaffees",paras:[
"Kaffee stammt ursprünglich aus dem Hochland Äthiopiens. Einer Legende nach bemerkte ein Hirte, dass seine Ziegen nach dem Fressen roter Beeren besonders munter waren. Ob das stimmt, weiß niemand. Sicher ist, dass Kaffee im 15. Jahrhundert im Jemen getrunken wurde, wo Sufi-Mönche ihn nutzten, um bei nächtlichen Gebeten wach zu bleiben.",
"Über den Hafen Mokka gelangte der Kaffee in die arabische Welt und von dort nach Europa. Im 17. Jahrhundert eröffneten in Venedig, London und Wien die ersten Kaffeehäuser. Sie wurden schnell zu Orten, an denen Händler Geschäfte machten und Bürger Zeitungen lasen und diskutierten.",
"Die wachmachende Wirkung verdankt der Kaffee dem Koffein. Es blockiert im Gehirn die Andockstellen für Adenosin, einen Botenstoff, der sich im Laufe des Tages ansammelt und müde macht. Die Müdigkeit verschwindet dadurch nicht, sie wird nur überdeckt. Da Koffein im Körper langsam abgebaut wird, kann eine Tasse am Nachmittag den Schlaf in der Nacht noch stören.",
"Heute zählt Kaffee zu den wichtigsten Handelsgütern der Welt. Größter Produzent ist Brasilien, gefolgt von Vietnam. Die meisten Bohnen gehören zu zwei Arten: dem milderen Arabica und dem kräftigeren, koffeinreicheren Robusta."],
qs:[
{q:"Woher stammt Kaffee ursprünglich?",a:["Aus Äthiopien","Aus Brasilien","Aus Venedig"]},
{q:"Wie wirkt Koffein?",a:["Es blockiert die Andockstellen für Adenosin","Es baut Müdigkeit dauerhaft ab","Es erhöht die Menge an Adenosin"]},
{q:"Welches Land produziert am meisten Kaffee?",a:["Brasilien","Vietnam","Jemen"]},
{q:"Welche Art ist koffeinreicher?",a:["Robusta","Arabica","Mokka"]}]},

{id:"B",kind:"train",title:"Ebbe und Flut",paras:[
"Zweimal am Tag zieht sich an der Nordseeküste das Wasser zurück und kehrt einige Stunden später wieder. Verantwortlich dafür ist vor allem der Mond. Seine Anziehungskraft zieht das Wasser auf der ihm zugewandten Seite der Erde ein wenig zu sich. Auf der gegenüberliegenden Seite entsteht ebenfalls ein Flutberg, weil dort die Anziehung schwächer ist und die Fliehkraft aus der gemeinsamen Bewegung von Erde und Mond überwiegt.",
"Die Erde dreht sich unter diesen beiden Flutbergen hindurch. Deshalb gibt es an den meisten Küsten zwei Hochwasser und zwei Niedrigwasser pro Tag. Weil der Mond sich gleichzeitig weiterbewegt, verschieben sich die Zeiten jeden Tag um knapp eine Stunde.",
"Auch die Sonne wirkt auf das Wasser, allerdings nur etwa halb so stark wie der Mond. Stehen Sonne, Mond und Erde in einer Linie, also bei Voll- und Neumond, addieren sich die Kräfte. Dann entsteht eine Springtide mit besonders hohem Wasserstand. Stehen Sonne und Mond im rechten Winkel zueinander, schwächen sie sich gegenseitig, und es kommt zur Nipptide.",
"Wie stark die Gezeiten ausfallen, hängt auch von der Form der Küste ab. Im Mittelmeer beträgt der Unterschied zwischen Hoch- und Niedrigwasser oft nur wenige Zentimeter. In der Bay of Fundy in Kanada kann er dagegen über fünfzehn Meter erreichen."],
qs:[
{q:"Wer verursacht die Gezeiten vor allem?",a:["Der Mond","Die Sonne","Der Wind"]},
{q:"Um wie viel verschieben sich die Zeiten jeden Tag?",a:["Um knapp eine Stunde","Um zwölf Stunden","Gar nicht"]},
{q:"Wann entsteht eine Springtide?",a:["Bei Voll- und Neumond","Bei Halbmond","Nur im Winter"]},
{q:"Wo ist der Unterschied zwischen Hoch- und Niedrigwasser sehr gering?",a:["Im Mittelmeer","In der Bay of Fundy","An der Nordsee"]}]},

{id:"C",kind:"train",title:"Das Bienenvolk",paras:[
"Eine Honigbiene allein kann wenig ausrichten. Ein Volk aus mehreren zehntausend Tieren aber verhält sich fast wie ein einziger Organismus. Im Zentrum steht die Königin, die im Sommer bis zu zweitausend Eier am Tag legen kann. Die meisten Bewohner des Stocks sind Arbeiterinnen. Sie putzen Waben, füttern die Brut, bauen, bewachen den Eingang und fliegen schließlich als Sammlerinnen aus.",
"Findet eine Sammlerin eine ergiebige Futterquelle, teilt sie das den anderen mit einem Tanz mit. Liegt die Quelle weiter entfernt, tanzt sie eine Acht und wackelt dabei mit dem Hinterleib. Die Richtung dieses Schwänzeltanzes auf der senkrechten Wabe zeigt den Winkel zur Sonne an, die Dauer verrät die Entfernung. Entschlüsselt hat diese Sprache der österreichische Forscher Karl von Frisch, der dafür 1973 den Nobelpreis erhielt.",
"Für den Menschen sind Bienen vor allem als Bestäuber wichtig. Viele Obstbäume und Feldfrüchte tragen ohne sie deutlich weniger Früchte. Neben der Honigbiene leisten Hunderte Wildbienenarten einen großen Teil dieser Arbeit. Viele von ihnen leben allein und nisten in Erdlöchern, Pflanzenstängeln oder Totholz. Sie leiden besonders darunter, dass blühende Wiesen und Nistplätze verschwinden."],
qs:[
{q:"Wie viele Eier kann eine Königin im Sommer täglich legen?",a:["Bis zu zweitausend","Bis zu zweihundert","Bis zu zwanzigtausend"]},
{q:"Was zeigt die Richtung des Schwänzeltanzes an?",a:["Den Winkel zur Sonne","Die Entfernung","Die Art der Blüte"]},
{q:"Wer hat die Bienensprache entschlüsselt?",a:["Karl von Frisch","Gregor Mendel","Konrad Lorenz"]},
{q:"Wo nisten viele Wildbienen?",a:["In Erdlöchern, Stängeln oder Totholz","Nur in Bienenstöcken","Ausschließlich in Baumkronen"]}]},

{id:"D",kind:"train",title:"Woher das Schach kommt",paras:[
"Die Wurzeln des Schachspiels liegen vermutlich in Indien. Dort entstand um das sechste Jahrhundert das Spiel Chaturanga, dessen Figuren die vier Teile eines Heeres darstellten: Fußsoldaten, Reiter, Elefanten und Streitwagen. Über Persien gelangte das Spiel in die arabische Welt, wo es Schatrandsch hieß und von Gelehrten intensiv studiert wurde.",
"Mit den Mauren kam das Spiel um das Jahr 1000 nach Spanien und verbreitete sich in Europa. Viele Regeln waren damals noch anders. Die Dame, ursprünglich ein Ratgeber des Königs, durfte nur ein Feld schräg ziehen, und auch der Läufer war sehr schwach. Partien dauerten entsprechend lange.",
"Ende des 15. Jahrhunderts änderte sich das grundlegend. In Spanien und Italien setzte sich eine neue Spielweise durch, in der die Dame zur stärksten Figur wurde und der Läufer über die ganze Diagonale ziehen durfte. Das Spiel wurde schneller und angriffslustiger. Zeitgenossen sprachen spöttisch vom Schach der verrückten Dame.",
"Im 19. Jahrhundert begannen große Turniere, und 1886 wurde mit Wilhelm Steinitz der erste allgemein anerkannte Weltmeister ermittelt. Heute spielen Millionen Menschen online, und Computerprogramme sind längst stärker als jeder Großmeister."],
qs:[
{q:"Wo liegen die Wurzeln des Schachspiels vermutlich?",a:["In Indien","In China","In Spanien"]},
{q:"Wie durfte die Dame früher ziehen?",a:["Nur ein Feld schräg","Beliebig weit in alle Richtungen","Wie ein Springer"]},
{q:"Wer war der erste allgemein anerkannte Weltmeister?",a:["Wilhelm Steinitz","Bobby Fischer","Emanuel Lasker"]},
{q:"Was änderte sich Ende des 15. Jahrhunderts?",a:["Die Dame wurde zur stärksten Figur","Die Bauern wurden abgeschafft","Das Brett wurde größer"]}]},

{id:"E",kind:"train",title:"Der Bundesfinanzhof",paras:[
"Wer mit dem Finanzamt über seine Steuer streitet und vor dem Finanzgericht verliert, hat oft noch eine Möglichkeit: die Revision zum Bundesfinanzhof. Der BFH mit Sitz in München ist das oberste deutsche Gericht für Steuern und Zölle. Er steht damit auf einer Stufe mit dem Bundesgerichtshof oder dem Bundesarbeitsgericht.",
"Anders als die Finanzgerichte prüft der BFH in der Regel keine Tatsachen mehr. Er klärt Rechtsfragen: Wurde das Gesetz richtig ausgelegt und angewendet? Zugelassen wird eine Revision vor allem dann, wenn eine Frage grundsätzliche Bedeutung hat, wenn die Rechtsprechung vereinheitlicht werden muss oder wenn das Finanzgericht einen schweren Verfahrensfehler gemacht hat. Lässt das Finanzgericht die Revision nicht zu, kann man dagegen Beschwerde einlegen.",
"Die Richterinnen und Richter arbeiten in Senaten, die jeweils für bestimmte Steuerarten zuständig sind, etwa für die Einkommensteuer, die Umsatzsteuer oder die Erbschaftsteuer. Ein Senat entscheidet über Urteile mit fünf Mitgliedern. Wollen zwei Senate eine Rechtsfrage unterschiedlich beantworten, entscheidet der Große Senat.",
"Die Urteile des BFH reichen weit über den Einzelfall hinaus. Die Finanzverwaltung veröffentlicht wichtige Entscheidungen im Bundessteuerblatt und wendet sie dann allgemein an. Manchmal reagiert sie aber auch mit einem sogenannten Nichtanwendungserlass. Dann gilt das Urteil zunächst nur für den entschiedenen Fall."],
qs:[
{q:"Wo sitzt der Bundesfinanzhof?",a:["In München","In Karlsruhe","In Berlin"]},
{q:"Was prüft der BFH in der Regel?",a:["Rechtsfragen","Tatsachen","Steuererklärungen"]},
{q:"Wer entscheidet, wenn zwei Senate unterschiedlich urteilen wollen?",a:["Der Große Senat","Das Bundesverfassungsgericht","Das Finanzministerium"]},
{q:"Was bewirkt ein Nichtanwendungserlass?",a:["Das Urteil gilt zunächst nur für den entschiedenen Fall","Das Urteil wird aufgehoben","Das Urteil gilt rückwirkend für alle"]}]},

{id:"F",kind:"train",title:"Die innere Uhr",paras:[
"Fast jede Zelle unseres Körpers folgt einem Rhythmus von ungefähr vierundzwanzig Stunden. Gesteuert wird diese innere Uhr von einer winzigen Region im Gehirn, dem suprachiasmatischen Kern. Er sitzt direkt über der Kreuzung der Sehnerven und bekommt so mit, wann es hell und wann es dunkel ist.",
"Der wichtigste Taktgeber ist Licht, vor allem am Morgen. Spezielle Zellen in der Netzhaut reagieren besonders auf helles, bläuliches Licht und melden es an die innere Uhr. Tageslicht ist dabei viel stärker als jede Zimmerlampe: Selbst an einem bewölkten Tag ist es draußen oft zehnmal so hell wie in einem gut beleuchteten Büro. Wer morgens einige Minuten draußen verbringt, stellt seine Uhr deshalb zuverlässiger als mit Licht aus der Leuchte.",
"Abends passiert das Gegenteil. Wenn es dunkel wird, schüttet der Körper das Hormon Melatonin aus und bereitet sich auf den Schlaf vor. Helles Licht am späten Abend kann diesen Prozess verzögern, sodass man später müde wird.",
"Gerät die innere Uhr aus dem Takt, etwa durch Schichtarbeit oder Flüge über mehrere Zeitzonen, leiden Schlaf, Konzentration und Stimmung. Für die Entdeckung der molekularen Mechanismen dieser Uhr erhielten drei amerikanische Forscher 2017 den Nobelpreis für Medizin."],

{id:"G",kind:"train",title:"Die Elbphilharmonie",paras:[
"Seit Januar 2017 hat Hamburg ein neues Wahrzeichen. Auf einem alten Kaispeicher am Rand der HafenCity erhebt sich die Elbphilharmonie, ein gläserner Bau mit wellenförmigem Dach, entworfen vom Schweizer Architekturbüro Herzog & de Meuron. Mit rund 110 Metern ist sie eines der höchsten Gebäude der Stadt. Neben Konzertsälen beherbergt sie auch ein Hotel und Wohnungen.",
"Der Weg dorthin war lang und teuer. Als das Projekt beschlossen wurde, rechnete die Stadt mit einem Anteil von gut siebzig Millionen Euro. Am Ende kostete es den Steuerzahler rund 790 Millionen, und die Eröffnung verschob sich um viele Jahre. Ein Untersuchungsausschuss beschäftigte sich mit Planungsfehlern und dem Streit zwischen Stadt und Baukonzern.",
"Heute spricht man vor allem über den Klang. Der Große Saal mit rund 2.100 Plätzen ist als sogenannter Weinberg gebaut: Die Zuschauer sitzen auf Terrassen rund um das Orchester, niemand ist mehr als dreißig Meter vom Dirigenten entfernt. Die Wände sind mit etwa zehntausend einzeln gefrästen Gipsplatten verkleidet, die den Schall gleichmäßig verteilen. Entwickelt wurde die Akustik von dem Japaner Yasuhisa Toyota.",
"Ein öffentlicher Platz in 37 Metern Höhe, die Plaza, bietet einen Rundumblick über Hafen und Stadt. Er ist ohne Konzertkarte zugänglich und hat seit der Eröffnung Millionen Besucher angelockt."],

{id:"H",kind:"train",title:"Wortschatz als Turbo",paras:[
"Wer schneller lesen will, denkt meist an Techniken für die Augen. Ein unterschätzter Hebel ist jedoch der Wortschatz. Jedes Wort, das wir nicht sofort erkennen, bremst. Wir verlangsamen, springen zurück oder raten aus dem Zusammenhang. Ein bekanntes Wort dagegen wird in Sekundenbruchteilen verarbeitet.",
"Ähnlich wirkt Vorwissen. Wer sich in einem Fachgebiet auskennt, kann vorhersagen, wie ein Satz vermutlich weitergeht. Das Gehirn muss weniger Neues verarbeiten und kommt schneller voran. Deshalb liest eine Steuerberaterin ein Urteil zum Umsatzsteuerrecht viel zügiger als ein Laie, obwohl beide gleich gut sehen.",
"Der beste Weg zu mehr Wortschatz und Wissen ist erstaunlich schlicht: viel und abwechslungsreich lesen. Menschen, die regelmäßig lesen, bauen über die Jahre einen deutlich größeren Wortschatz auf. Jede Seite bringt neue Wörter in neuen Zusammenhängen.",
"Für das Training bedeutet das: Neben den Übungen mit dem Pacer lohnt es sich, jeden Tag ein paar Minuten frei zu lesen, am besten Texte, die etwas über dem eigenen Niveau liegen. Wer dabei unbekannte Begriffe kurz nachschlägt, macht sein Lesen langfristig schneller, ganz ohne Tricks."],

{id:"K1",kind:"classic",title:"John Maynard (Theodor Fontane)",paras:[
"»Wer ist John Maynard?« »John Maynard war unser Steuermann, Aus hielt er, bis er das Ufer gewann, Er hat uns gerettet, er trägt die Kron, Er starb für uns, unsre Liebe sein Lohn. John Maynard.«",
"Die »Schwalbe« fliegt über den Erisee, Gischt schäumt um den Bug wie Flocken von Schnee; Von Detroit fliegt sie nach Buffalo – Die Herzen aber sind frei und froh, Und die Passagiere mit Kindern und Fraun Im Dämmerlicht schon das Ufer schaun, Und plaudernd an John Maynard heran Tritt alles: »Wie weit noch, Steuermann?« Der schaut nach vorn und schaut in die Rund: »Noch dreißig Minuten ... Halbe Stund.«",
"Alle Herzen sind froh, alle Herzen sind frei – Da klingt's aus dem Schiffsraum her wie Schrei, »Feuer!« war es, was da klang, Ein Qualm aus Kajüt und Luke drang, Ein Qualm, dann Flammen lichterloh, Und noch zwanzig Minuten bis Buffalo.",
"Und die Passagiere, bunt gemengt, Am Bugspriet stehn sie zusammengedrängt, Am Bugspriet vorn ist noch Luft und Licht, Am Steuer aber lagert sich’s dicht, Und ein Jammern wird laut: »Wo sind wir? wo?« Und noch fünfzehn Minuten bis Buffalo. –",
"Der Zugwind wächst, doch die Qualmwolke steht, Der Kapitän nach dem Steuer späht, Er sieht nicht mehr seinen Steuermann, Aber durchs Sprachrohr fragt er an: »Noch da, John Maynard?« »Ja, Herr. Ich bin.« »Auf den Strand! In die Brandung!« »Ich halte drauf hin.« Und das Schiffsvolk jubelt: »Halt aus! Hallo!« Und noch zehn Minuten bis Buffalo. –",
"»Noch da, John Maynard?« Und Antwort schallt's Mit ersterbender Stimme: »Ja, Herr, ich halt's!« Und in die Brandung, was Klippe, was Stein, Jagt er die »Schwalbe« mitten hinein. Soll Rettung kommen, so kommt sie nur so. Rettung: der Strand von Buffalo!",
"Das Schiff geborsten. Das Feuer verschwelt. Gerettet alle. Nur einer fehlt!",
"Alle Glocken gehn; ihre Töne schwell'n Himmelan aus Kirchen und Kapell'n, Ein Klingen und Läuten, sonst schweigt die Stadt, Ein Dienst nur, den sie heute hat: Zehntausend folgen oder mehr, Und kein Aug im Zuge, das tränenleer.",
"Sie lassen den Sarg in Blumen hinab, Mit Blumen schließen sie das Grab, Und mit goldner Schrift in den Marmorstein Schreibt die Stadt ihren Dankspruch ein: »Hier ruht John Maynard! In Qualm und Brand Hielt er das Steuer fest in der Hand, Er hat uns gerettet, er trägt die Kron, Er starb für uns, unsre Liebe sein Lohn. John Maynard.«"],

{id:"D1",kind:"drill",title:"So funktioniert der Pacer",paras:[
"Der Pacer ist ein Leuchtmarker, der unter der Zeile entlangläuft. Deine Augen folgen ihm, statt selbst zu entscheiden, wann es weitergeht. Das klingt banal, hat aber eine Wirkung: Der Blick bleibt seltener hängen, schweift weniger ab und springt seltener ohne Grund zurück. Viele Leser merken erst mit dem Pacer, wie oft sie gedanklich abschweifen.",
"Beim Üben gilt eine einfache Regel. Im normalen Pacer-Lesen stellst du das Tempo so ein, dass du gerade noch gut verstehst. Beim Sprint gehst du bewusst darüber hinaus. Dort geht es nicht um Verständnis, sondern darum, Augen und Aufmerksamkeit an ein höheres Tempo zu gewöhnen. Danach fühlt sich das normale Tempo leichter an.",
"Wichtig ist, ruhig zu bleiben. Wenn du ein Wort verpasst, lass es los und folge dem Marker. Der Sinn eines Absatzes ergibt sich meistens trotzdem. Wenn du merkst, dass du gar nichts mehr verstehst, nimm das Tempo zurück. Schneller lesen heißt im Training immer: so schnell wie möglich, so langsam wie nötig.",
"Mit der Zeit kannst du die Zeilen etwas enger erfassen. Statt am ersten Wort einer Zeile zu beginnen, setzt der Blick ein Stück weiter innen an und springt vor dem letzten Wort schon in die nächste Zeile. Die Ränder nimmst du mit dem unscharfen Sehen am Rand trotzdem wahr."]},

{id:"D2",kind:"drill",title:"Lesen mit Ziel",paras:[
"Nicht jeder Text verdient dieselbe Aufmerksamkeit. Eine Mail, die nur eine Uhrzeit bestätigt, braucht einen kurzen Blick. Ein Urteil, über das du morgen beraten musst, braucht volle Konzentration. Gute Leser wechseln deshalb bewusst zwischen verschiedenen Gängen.",
"Der erste Gang ist das Überfliegen. Du liest Überschriften, den ersten Satz jedes Absatzes und hervorgehobene Wörter. Nach einer Minute weißt du, worum es geht und ob sich genaues Lesen lohnt. Der zweite Gang ist das Suchen: Du jagst eine bestimmte Information, etwa ein Datum oder einen Betrag, und ignorierst alles andere.",
"Der dritte Gang ist das zügige Lesen mit gutem Verständnis. Hier hilft der Pacer am meisten. Der vierte Gang ist das langsame, genaue Lesen für schwierige Stellen, Zahlen und Formulierungen, bei denen jedes Wort zählt. Auch das gehört zum schnellen Lesen, denn wer an den richtigen Stellen langsam wird, muss später nichts noch einmal lesen.",
"Bevor du einen längeren Text beginnst, stell dir deshalb kurz zwei Fragen: Was will ich aus diesem Text wissen? Und wie genau muss ich es wissen? Die Antworten entscheiden, welchen Gang du einlegst."]}
];

const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="style") el.style.cssText=v;
    else el.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}

function hash(s){ let x=2166136261; for(const c of s){ x^=c.charCodeAt(0); x=Math.imul(x,16777619);} return x>>>0; }
function shuffled(arr, seed){ const a=arr.slice(); let s=seed||1; for(let i=a.length-1;i>0;i--){ s=(Math.imul(s,1103515245)+12345)>>>0; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const LS_KEY="sr-trainer-v1";
function freshState(){ return {v:1, updatedAt:0, baseline:null, target:null, lessons:{}, sessions:[], xp:0, badges:{}, schulteBest:null, sprints:0, seen:{}, ai:[], spanBest:0}; }
const HOSTED=!!window.SR_HOSTED;
function localLoad(){ if(HOSTED) return null; try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); return s&&s.v?s:null; }catch(e){ return null; } }
function localSave(s){ if(HOSTED) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
let S = localLoad() || freshState();

/* Optional external storage: window.SR_STORAGE = {load():Promise<state|null>, save(state):Promise} (hosted app),
   otherwise the Claude artifact database is used when available. */
const Store = {
  backend:null, chain:Promise.resolve(), pending:null,
  async connect(){
    try{
      if(window.SR_READY){ try{ await window.SR_READY; }catch(e){} }
      if(window.SR_STORAGE){ this.backend=window.SR_STORAGE; }
      else if(window.claude && window.claude.use){
        const db = await window.claude.use("db");
        if(db){ const ref=db.doc("progress/main");
          this.backend={ load:async()=>{ const s=await ref.get(); return s.exists?s.data():null; }, save:st=>ref.set(JSON.parse(JSON.stringify(st))) }; }
      }
      if(!this.backend){ setSync("Fortschritt wird nur in diesem Browser gespeichert."); return; }
      const remote = await this.backend.load();

    h("p",{class:"prose"},testId?`Lies den Text in deinem natürlichen Tempo, so wie du sonst liest. ${words} Wörter. Die Zeit läuft ab Start, danach kommen ${t.qs.length} Fragen ohne Text.`:`Lies den Text in deinem eigenen Tempo, gern etwas zügiger als gewohnt. ${words} Wörter. Danach kommen ${t.qs.length} Fragen.`),
    repeat?h("p",{class:"notice"},"Alle Übungstexte sind schon gelesen und ein neuer KI-Text war nicht möglich. Dieser Text ist eine Wiederholung und zählt nicht für das Pacer-Ziel."):null,
    h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>openReader({text:t,mode:"self",title:t.title,onDone:r=>{
      const wpm=Math.min(1500,words/(Math.max(1000,r.ms)/60000)); S.seen[t.id]=(S.seen[t.id]||0)+1;
      Quiz.open(t,c=>{

        S.sessions.push(rec);

        if(Run.n===1&&testId){ S.baseline={wpm:Math.round(wpm),comp:c,eff:Math.round(eff),date:today()}; S.target=Math.round(Math.max(150,Math.min(450,wpm))/5)*5; note=`Dein Startwert für den Pacer ist ${nf(S.target)} WpM.`; }
        else if(!repeat){ const old=tgt(); if(c>=.75) S.target=Math.round(Math.max(old*1.05, Math.min(old*1.1, wpm))/5)*5; else if(c<.65) S.target=Math.max(120,Math.round(old*0.95/5)*5);
          note = S.target>old?`Gut verstanden: Das Pacer-Ziel steigt auf ${nf(S.target)} WpM.`: S.target<old?`Zu viel verloren: Das Pacer-Ziel sinkt auf ${nf(S.target)} WpM.`:`Das Pacer-Ziel bleibt bei ${nf(S.target)} WpM.`; }

}
function resultScreen(box,rec,note,go){

}
function finishLesson(){

    fresh.length?h("div",{class:"badges"},fresh.map(b=>h("div",{class:"badge on"},h("b",{text:"Neu: "+b.name}),h("span",{text:b.desc})))):null,
    h("p",{},n===48?"Du hast den Kurs abgeschlossen. Im Reiter Fortschritt siehst du den Vergleich mit deinem Einstiegstest.":"Morgen wartet die nächste Lektion. Um 20 Uhr fragt Claude im Projekt kurz nach."),
    h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>{ Tab="heute"; render(); }},"Fertig"),h("button",{class:"btn",onclick:()=>{ Tab="fortschritt"; render(); }},"Fortschritt ansehen"))));
}

/* ============ QUIZ ============ */
const Quiz={ open(t,done,host){
  const target=host||$("#view"); let i=0, right=0;
  const qs=t.qs.map(q=>({q:q.q,opts:shuffled(q.a.map((a,k)=>({a,ok:k===0})),hash(q.q))}));
  const show=()=>{
    const q=qs[i]; let answered=false;
    const opts=q.opts.map(o=>{ const b=h("button",{class:"opt",onclick:()=>{ if(answered) return; answered=true; if(o.ok) right++; b.classList.add(o.ok?"right":"wrong"); if(!o.ok) opts[q.opts.findIndex(x=>x.ok)].classList.add("right"); nextBtn.disabled=false; nextBtn.focus(); }},o.a); return b; });
    const nextBtn=h("button",{class:"btn primary",disabled:true,onclick:()=>{ i++; if(i<qs.length) show(); else done(right/qs.length); }},i<qs.length-1?"Nächste Frage":"Auswerten");
    target.replaceChildren(h("p",{class:"eyebrow"},`Frage ${i+1} von ${qs.length}`),h("h3",{text:q.q}),h("div",{class:"opts"},opts),h("div",{class:"row"},nextBtn));
  };
  show();
}};

/* ============ ZAHLENTAFEL ============ */
function Schulte(box,next){
  const nums=shuffled([...Array(25)].map((_,i)=>i+1),Date.now()>>>0); let want=1, t0=0, timer=0;
  const clock=h("span",{class:"wpm",text:"0:00"});
  const grid=h("div",{class:"schulte"});
  const cells=nums.map(n=>h("button",{class:"cell",onclick:e=>{ if(!t0) return; const b=e.currentTarget; if(n===want){ b.classList.add("hit"); want++; if(want>25){ clearInterval(timer); const ms=Date.now()-t0; const best=S.schulteBest==null||ms<S.schulteBest; if(best) S.schulteBest=ms; save(); fin(ms,best);} } else { b.classList.add("miss"); setTimeout(()=>b.classList.remove("miss"),300);} }},String(n)));
  grid.append(...cells,h("span",{class:"center-dot"}));
  const startBtn=h("button",{class:"btn primary",onclick:()=>{ t0=Date.now(); startBtn.hidden=true; timer=setInterval(()=>clock.textContent=fmtTime(Date.now()-t0),250); }},"Start");
  box.append(h("p",{class:"eyebrow"},STEP_NAMES.schulte),h("p",{class:"prose"},"Halte den Blick auf dem roten Punkt in der Mitte und tippe die Zahlen von 1 bis 25 der Reihe nach an. Versuche, die Zahlen mit dem Rand des Blickfelds zu finden, statt mit den Augen zu suchen."),
    h("div",{class:"row",style:"justify-content:space-between"},startBtn,h("span",{},"Zeit ",clock),h("span",{class:"muted"},S.schulteBest?`Bestzeit ${fmtTime(S.schulteBest)}`:"")),grid,
    h("div",{class:"row"},h("button",{class:"btn ghost",onclick:()=>{ clearInterval(timer); next(); }},"Überspringen")));
  function fin(ms,best){ box.replaceChildren(h("p",{class:"eyebrow"},STEP_NAMES.schulte),h("div",{class:"big",text:fmtTime(ms)}),h("p",{},best?"Neue Bestzeit.":`Bestzeit ${fmtTime(S.schulteBest)}.`),h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>next({t:"schulte",ms})},"Weiter"))); }
}

/* ============ BLICKSPANNE ============ */
function Span(box,next){
  const pool=[...new Set(TEXTS.filter(t=>t.kind==="train").flatMap(t=>t.paras.join(" ").replace(/[.,:;!?„“"()]/g,"").split(/\s+/)).filter(w=>w.length>=3&&w.length<=9))];
  let size=2, round=0, right=0, streakOk=0, ms=240, best=2; const ROUNDS=12;
  const stage=h("div",{class:"flash"},"+"); const info=h("p",{class:"muted"}); const opts=h("div",{class:"opts"});
  box.append(h("p",{class:"eyebrow"},STEP_NAMES.span),h("p",{class:"prose"},"Schau auf das Kreuz. Kurz blitzt eine Wortgruppe auf. Wähle danach, welche es war. Mit jedem Erfolg wird die Gruppe länger."),stage,info,opts,
    h("div",{class:"row"},h("button",{class:"btn primary",id:"span-go",onclick:e=>{ e.currentTarget.hidden=true; play(); }},"Start"),h("button",{class:"btn ghost",onclick:()=>next()},"Überspringen")));
  const rnd=()=>pool[Math.floor(Math.random()*pool.length)];
  function play(){
    if(round>=ROUNDS){ S.spanBest=Math.max(S.spanBest||0,best); save(); box.replaceChildren(h("p",{class:"eyebrow"},STEP_NAMES.span),h("div",{class:"big",text:`${right} von ${ROUNDS}`}),h("p",{},`Längste sicher erkannte Gruppe: ${best} Wörter.`),h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>next({t:"span",right,best})},"Weiter"))); return; }
    round++; opts.replaceChildren(); info.textContent=`Runde ${round} von ${ROUNDS} · ${size} Wörter`;
    const g=[...Array(size)].map(rnd), shown=g.join(" ");
    const variants=new Set([shown]); while(variants.size<3){ const c=g.slice(); c[Math.floor(Math.random()*size)]=rnd(); variants.add(c.join(" ")); }
    stage.textContent="+";
    setTimeout(()=>{ stage.textContent=shown; setTimeout(()=>{ stage.textContent="#".repeat(Math.min(28,shown.length));
      opts.replaceChildren(...shuffled([...variants],Date.now()>>>0).map(vv=>h("button",{class:"opt",onclick:e=>{ const ok=vv===shown; e.currentTarget.classList.add(ok?"right":"wrong"); if(ok){ right++; streakOk++; best=Math.max(best,size); if(streakOk>=2&&size<6){ size++; streakOk=0; } ms=Math.max(120,ms-10);} else { streakOk=0; if(size>2) size--; } setTimeout(play,500); }},vv)));
    },ms); },600);
  }
}

/* ============ LESEFENSTER ============ */
const RD={ open:false };
function readerSize(d){ let s=1.25; try{ s=parseFloat(localStorage.getItem("sr-size"))||1.25; }catch(e){} if(d){ s=Math.min(2,Math.max(.95,s+d)); try{ localStorage.setItem("sr-size",s);}catch(e){} } document.documentElement.style.setProperty("--rsize",s+"rem"); }
readerSize(0);
function openReader(o){
  Object.assign(RD,{open:true,o,mode:o.mode,wpm:o.wpm||250,running:false,t0:0,acc:0,last:0,unit:0,frac:0,units:[],words:[],raf:0,done:false,wake:null});
  const el=$("#reader"), tx=$("#rtext"), rs=$("#rsvp");
  $("#rtitle").textContent=o.title||"";
  const showWpm=["line","chunk","rsvp"].includes(o.mode);
  for(const id of ["rslow","rfast","rwpm"]) $("#"+id).hidden=!showWpm;
  $("#rwpm").textContent=nf(RD.wpm)+" WpM";
  $("#rpause").hidden=!(showWpm); $("#rpause").textContent="Pause";
  $("#rgo").textContent="Start"; $("#rgo").disabled=false; $("#rprog").style.width="0";
  $("#rclock").textContent= o.limitMs?fmtTime(o.limitMs):"0:00";
  tx.className=""; tx.replaceChildren(h("div",{id:"rmark"}));
  const isRsvp=o.mode==="rsvp"; $("#rscroll").hidden=isRsvp; rs.hidden=!isRsvp;
  let wi=0;
  for(const para of o.text.paras){
    const p=h("p"); const ws=para.split(/\s+/).filter(Boolean);
    let lead=o.mode==="skim", leadEnd=false;
    ws.forEach((w,k)=>{ const sp=h("span",{class:"w"+(lead&&!leadEnd?" lead":"")},w); sp.dataset.i=wi++; RD.words.push({el:sp,w}); p.append(sp); if(k<ws.length-1) p.append(" "); if(lead&&!leadEnd&&/[.!?]$/.test(w)) leadEnd=true; });
    tx.append(p);
  }
  if(o.mode==="self") tx.classList.add("blur");
  if(o.mode==="skim") tx.classList.add("skim");
  if(o.mode==="line"||o.mode==="chunk") tx.classList.add("dim");
  rs.firstElementChild.textContent= isRsvp?"Bereit":"";
  el.hidden=false; document.body.style.overflow="hidden"; $("#rscroll").scrollTop=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ layoutUnits(); placeMark(); }));
  $("#rgo").focus();
}
function rel(el){ const r=el.getBoundingClientRect(), b=$("#rtext").getBoundingClientRect(); return {top:r.top-b.top,left:r.left-b.left,w:r.width,h:r.height}; }
function layoutUnits(){
  if(!RD.open) return; const ws=RD.words; RD.units=[]; if(!ws.length) return;
  const lines=[]; let cur=[], top=null;
  ws.forEach((w,i)=>{ const t=rel(w.el).top; if(top===null||Math.abs(t-top)>4){ if(cur.length) lines.push(cur); cur=[i]; top=t; } else cur.push(i); });
  if(cur.length) lines.push(cur);
  if(RD.mode==="chunk"){ for(const ln of lines){ let g=[]; ln.forEach((i,k)=>{ g.push(i); const w=ws[i].w; const brk=g.length>=3||/[,.;:!?]$/.test(w)||(g.length>=2&&/^(und|oder|aber|denn|dass|weil|die|der|das|den|dem|ein|eine|im|in|am|auf|mit|von|zu|für)$/i.test(ws[ln[k+1]]?.w||"")); if(brk||k===ln.length-1){ RD.units.push(g); g=[]; } }); } }
  else RD.units=lines;
  // keep position after relayout
  if(RD.curWord!=null){ const u=RD.units.findIndex(u=>u.includes(RD.curWord)); if(u>=0) RD.unit=u; }
}
function placeMark(){
  const m=$("#rmark"); if(!m) return;
  if(!(RD.mode==="line"||RD.mode==="chunk")||!RD.units.length){ m.style.height="0"; return; }
  const u=RD.units[Math.min(RD.unit,RD.units.length-1)]; const a=RD.words[u[0]].el, b=RD.words[u[u.length-1]].el;
  for(const w of document.querySelectorAll("#rtext .w.on")) w.classList.remove("on");
  for(const i of u) RD.words[i].el.classList.add("on");
  const ra=rel(a), rb=rel(b), left=ra.left-3, full=rb.left+rb.w-ra.left+6;
  m.style.top=(ra.top-2)+"px"; m.style.height=(ra.h+4)+"px"; m.style.left=left+"px";
  m.style.width=(RD.mode==="line"? Math.max(8,full*Math.min(1,RD.frac+.08)) : full)+"px";
  RD.curWord=u[0];
  const sc=$("#rscroll"), y=a.getBoundingClientRect().top-sc.getBoundingClientRect().top; if(y>sc.clientHeight*.45||y<40) sc.scrollTo({top:Math.max(0,sc.scrollTop+y-sc.clientHeight*.3),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function tick(now){
  if(!RD.open||!RD.running) return;
  const dt=Math.min(100,now-RD.last); RD.last=now; RD.acc+=dt;
  if(RD.mode==="rsvp"){
    const w=RD.words[RD.unit]; if(!w){ return endReader(); }
    const dur=60000/RD.wpm*(/[.!?;:]$/.test(w.w)?1.8:/,$/.test(w.w)?1.3:1)*(w.w.length>9?1.2:1);
    RD.frac+=dt/dur; if(RD.frac>=1){ RD.frac=0; RD.unit++; const nw=RD.words[RD.unit]; if(!nw) return endReader(); $("#rsvp span").textContent=nw.w; }
    $("#rprog").style.width=(RD.unit/RD.words.length*100)+"%";
  } else if(RD.mode==="line"||RD.mode==="chunk"){
    const u=RD.units[RD.unit]; if(!u) return endReader();
    const dur=u.length*60000/RD.wpm*(RD.mode==="chunk"&&/[.!?]$/.test(RD.words[u[u.length-1]].w)?1.25:1);
    RD.frac+=dt/dur; if(RD.frac>=1){ RD.frac=0; RD.unit++; if(RD.unit>=RD.units.length) return endReader(); }
    placeMark(); const doneW=RD.units.slice(0,RD.unit).reduce((a,u)=>a+u.length,0); $("#rprog").style.width=(doneW/RD.words.length*100)+"%";
  } else if(RD.mode==="skim"){
    const left=RD.o.limitMs-RD.acc; $("#rprog").style.width=Math.min(100,RD.acc/RD.o.limitMs*100)+"%"; if(left<=0) return endReader();
    $("#rclock").textContent=fmtTime(left); RD.raf=requestAnimationFrame(tick); return;
  }
  $("#rclock").textContent=fmtTime(RD.acc);
  RD.raf=requestAnimationFrame(tick);
}
async function startReader(){
  if(RD.done){ return finishReader(); }
  if(RD.mode==="self"&&RD.running){ return endReader(); }
  RD.running=true; RD.last=performance.now();
  try{ RD.wake=await navigator.wakeLock?.request("screen"); }catch(e){}
  if(RD.mode==="self"){ $("#rtext").classList.remove("blur"); RD.t0=Date.now(); $("#rgo").textContent="Fertig gelesen"; const iv=setInterval(()=>{ if(!RD.open||!RD.running){ clearInterval(iv); return;} $("#rclock").textContent=fmtTime(Date.now()-RD.t0); },500); return; }
  if(RD.mode==="rsvp"&&RD.unit===0) $("#rsvp span").textContent=RD.words[0].w;
  $("#rgo").textContent="Beenden"; RD.raf=requestAnimationFrame(tick);
}
function endReader(){
  RD.running=false; cancelAnimationFrame(RD.raf); RD.done=true;
  if(RD.mode==="self") RD.ms=Date.now()-RD.t0;
  $("#rprog").style.width="100%"; $("#rgo").textContent="Weiter"; $("#rpause").hidden=true; $("#rgo").focus();
  if(RD.mode==="self"||RD.mode==="skim") finishReader();
}
function finishReader(){ const o=RD.o, ms=RD.ms||RD.acc, wpm=RD.wpm; closeReader(); o.onDone&&o.onDone({ms,wpm}); }
function closeReader(){ RD.open=false; RD.running=false; cancelAnimationFrame(RD.raf); try{ RD.wake&&RD.wake.release(); }catch(e){} $("#reader").hidden=true; document.body.style.overflow=""; if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); }
$("#rgo").addEventListener("click",()=>{ if(RD.running&&RD.mode!=="self") endReader(); else startReader(); });
$("#rpause").addEventListener("click",()=>{ if(RD.done) return; if(RD.running){ RD.running=false; cancelAnimationFrame(RD.raf); $("#rpause").textContent="Weiter"; } else { RD.running=true; RD.last=performance.now(); $("#rpause").textContent="Pause"; RD.raf=requestAnimationFrame(tick); } });
$("#rclose").addEventListener("click",()=>{ closeReader(); render(); });
const setWpm=d=>{ RD.wpm=Math.max(80,Math.min(1200,RD.wpm+d)); $("#rwpm").textContent=nf(RD.wpm)+" WpM"; };
$("#rslow").addEventListener("click",()=>setWpm(-10)); $("#rfast").addEventListener("click",()=>setWpm(10));
$("#rsmall").addEventListener("click",()=>{ readerSize(-.1); requestAnimationFrame(()=>{ layoutUnits(); placeMark(); }); });
$("#rbig").addEventListener("click",()=>{ readerSize(.1); requestAnimationFrame(()=>{ layoutUnits(); placeMark(); }); });
$("#rfull").addEventListener("click",()=>{ const d=document.documentElement; if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); else d.requestFullscreen?.().catch(()=>{}); });
window.addEventListener("resize",()=>{ if(RD.open) requestAnimationFrame(()=>{ layoutUnits(); placeMark(); }); });
document.addEventListener("keydown",e=>{ if(!RD.open) return; if(e.key==="Escape"){ closeReader(); render(); } else if(e.key===" "&&e.target.tagName!=="BUTTON"){ e.preventDefault(); $("#rpause").hidden?$("#rgo").click():$("#rpause").click(); } else if(e.key==="ArrowUp") setWpm(10); else if(e.key==="ArrowDown") setWpm(-10); });

/* ============ START ============ */
render();
Store.connect();
connectAI();
</script>
