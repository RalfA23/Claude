<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1a22">
<title>Produktivität</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Überblick über die Produktivitäts-Hacks aus den Produktivikus-Videos: acht Themen als Karten, je eine kurze Liste. Keine Häkchen, keine Speicherung. */
:root{
  --bg:#0e1a22; --surface:#15252f; --fg:#eef6f3; --muted:#9db3b0; --line:#24394a; --accent:#5fd3a7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1000px;margin:0 auto;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:14px}
.back:hover{color:var(--fg)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800;margin-top:6px}
h2{font-size:1.2rem;font-weight:800}
.lede{color:var(--muted);max-width:60ch;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .head{display:flex;align-items:center;gap:10px}
.card .ico{font-size:1.6rem;line-height:1}
.card .n{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.card li{position:relative;padding-left:20px;font-size:.96rem;line-height:1.45}
.card li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
footer{margin-top:34px;color:var(--muted);font-size:.85rem}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../lernen/">← Lernen</a>
  <p class="eyebrow">Lebensplattform · Lernen</p>
  <h1>Produktivität</h1>
  <p class="lede">Die wichtigsten Hacks aus den Produktivikus-Videos, nach acht Themen geordnet. Ein Überblick statt Liste zum Abarbeiten.</p>
  <div class="grid" id="grid"></div>
  <footer>Quelle: <a href="https://www.youtube.com/@Produktivikus" target="_blank" rel="noopener">Produktivikus</a> und die Artikel auf <a href="https://produktivikus.de/" target="_blank" rel="noopener">produktivikus.de</a>. Stand 16.11.2026.</footer>
</div>
<script>
/*DATEN*/
(function () {
  "use strict";
  var grid = document.getElementById("grid");
  DATA.themen.forEach(function (t) {
    var card = document.createElement("article");
    card.className = "card";
    var head = document.createElement("div");
    head.className = "head";
    head.innerHTML = "";
    var ico = document.createElement("span"); ico.className = "ico"; ico.setAttribute("aria-hidden", "true"); ico.textContent = t.icon;
    var h = document.createElement("h2"); h.textContent = t.title;
    var n = document.createElement("span"); n.className = "n"; n.textContent = "Top 3";
    head.appendChild(ico); head.appendChild(h); head.appendChild(n);
    var ul = document.createElement("ul");
    (t.kernliste || []).slice(0, 3).forEach(function (x) { var li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
    card.appendChild(head); card.appendChild(ul);
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
