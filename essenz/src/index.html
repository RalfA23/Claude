<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1a22">
<title>Produktivität</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Überblick der Produktivitäts-Hacks: acht Themen als Karten, je ein Ablaufbild mit drei Schritten. Keine Häkchen, keine Speicherung. */
:root{
  --bg:#0e1a22; --surface:#15252f; --surface2:#1b3140; --fg:#eef6f3; --muted:#9db3b0; --line:#24394a; --accent:#5fd3a7; --warm:#ffb547;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1000px;margin:0 auto;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:14px}
.back:hover{color:var(--fg)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800;margin-top:6px}
h2{font-size:1.2rem;font-weight:800}
.lede{color:var(--muted);max-width:60ch;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;align-items:center;gap:10px}
.ico{font-size:1.5rem;line-height:1}
.head h2{font-size:1.05rem}
.flow{display:flex;align-items:stretch;gap:6px}
.step{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.step .num{font:800 .75rem var(--display);color:var(--bg);background:var(--accent);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin:0 auto}
.step b{font-weight:700;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere}
.arr{align-self:center;color:var(--accent);font-size:1.1rem;flex:none}
.caption{font-size:.86rem;color:var(--muted);margin:0}
footer{margin-top:34px;color:var(--muted);font-size:.85rem}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../lernen/">← Lernen</a>
  <p class="eyebrow">Lebensplattform · Lernen</p>
  <h1>Produktivität</h1>
  <p class="lede">Die wichtigsten Hacks aus den Produktivikus-Videos, nach acht Themen. Pro Thema ein Ablauf in drei Schritten.</p>
  <div class="grid" id="grid"></div>
  <footer>Quelle: <a href="https://www.youtube.com/@Produktivikus" target="_blank" rel="noopener">Produktivikus</a> und die Artikel auf <a href="https://produktivikus.de/" target="_blank" rel="noopener">produktivikus.de</a>. Stand 16.11.2026.</footer>
</div>
<script>
/*DATEN*/
(function () {
  "use strict";
  // Drei Schritte je Thema, kurz gefasst aus den Hacks des Themas (Reihenfolge: Start, Mitte, Ziel).
  var FLOW = {
    handeln: ["Winzig anfangen", "Wenn-dann-Plan", "Einfach machen"],
    gewohnheiten: ["Mini-Start", "Fester Ort & Zeit", "Nie zweimal aussetzen"],
    fokus: ["Handy weg", "Eine Aufgabe", "60–90 Min Block"],
    energie: ["Fester Schlaf", "Tageslicht am Morgen", "Bildschirm aus"],
    kopf: ["Pause atmen", "Gedanken beobachten", "Freundlich zu dir"],
    menschen: ["Kurz & neutral", "Klare Grenze", "Nein sagen"],
    glueck: ["Dankbar sein", "Echt verbinden", "Freude planen"],
    einfach: ["Erst fragen", "Aufräumen", "Top drei"]
  };
  var grid = document.getElementById("grid");
  DATA.themen.forEach(function (t) {
    var card = document.createElement("article");
    card.className = "card";
    var head = document.createElement("div"); head.className = "head";
    var ico = document.createElement("span"); ico.className = "ico"; ico.setAttribute("aria-hidden", "true"); ico.textContent = t.icon;
    var h = document.createElement("h2"); h.textContent = t.title;
    head.appendChild(ico); head.appendChild(h);
    var flow = document.createElement("div"); flow.className = "flow";
    var steps = FLOW[t.id] || [];
    steps.forEach(function (s, i) {
      if (i > 0) { var a = document.createElement("span"); a.className = "arr"; a.setAttribute("aria-hidden", "true"); a.textContent = "→"; flow.appendChild(a); }
      var box = document.createElement("div"); box.className = "step";
      var n = document.createElement("span"); n.className = "num"; n.textContent = String(i + 1);
      var b = document.createElement("b"); b.textContent = s;
      box.appendChild(n); box.appendChild(b); flow.appendChild(box);
    });
    var cap = document.createElement("p"); cap.className = "caption";
    cap.textContent = (t.kernliste || []).length + " Hacks in diesem Thema";
    card.appendChild(head); card.appendChild(flow); card.appendChild(cap);
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
