<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3261E">
<meta name="description" content="Schachtraining: Woodpecker-Aufgaben, Smirnov-Lektionen und tägliche Abfrage mit Fortschrittskontrolle.">
<meta name="robots" content="noindex,nofollow">
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<script>window.SCH_HOSTED = !!(window.SR_CONFIG && window.SR_CONFIG.supabaseUrl && window.SR_CONFIG.supabaseAnonKey);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style id="sch-hide">.wrap{display:none}</style>
<script src="hosted.js"></script>
</head>
<body>
<!--TRAINER-->
<footer style="text-align:center;font:13px system-ui,sans-serif;padding:0 16px 24px;opacity:.7"><a href="../impressum.html" style="color:inherit">Impressum</a> · <a href="../datenschutz.html" style="color:inherit">Datenschutz</a></footer>
<script>
// Hosted: the trainer script starts after login, once the user's own training data ("daten/start") is loaded.
// First visit on an account: the data is not there yet, so a one-time setup asks for the seed file.
window.addEventListener("DOMContentLoaded", async function () {
  var main = document.getElementById("sch-main");
  if (!main) return;
  if (!window.SCH_HOSTED) { document.body.insertAdjacentHTML("afterbegin", "<p style='max-width:420px;margin:48px auto;font-family:system-ui,sans-serif'>Diese Seite ist ohne Anmeldung nicht eingerichtet.</p>"); return; }
  await window.SCH_READY;
  var db = await window.claude.use("db");
  var POOL_MIN = 50;
  // Free tactics (no book file): random puzzles from the public Lichess puzzle database, kept in the user's own account.
  async function loadPool(status, d) {
    var items = [];
    try { var ps = await db.doc("puzzles/pool").get(); if (ps && ps.exists && ps.data().items) items = ps.data().items; } catch (e) {}
    if (items.length >= POOL_MIN) return items;
    var seen = {}; items.forEach(function (i) { seen[i.id] = 1; });
    // Stufen nach Ziel-Wertung: Aufgaben von knapp unter der aktuellen Wertung bis knapp über dem Ziel, aufsteigend sortiert.
    var z = 0, r = 0;
    try { var u = await db.doc("einstellungen/ui").get(); if (u && u.exists) z = +u.data().ziel || 0; } catch (e) {}
    try { var rk = Object.keys((d && d.rate) || {}).sort(); if (rk.length) r = +d.rate[rk[rk.length - 1]] || 0; } catch (e) {}
    var fresh = !items.length, lo = 0, hi = 99999, levels = [null];
    if (fresh && (z || r)) {
      z = z || r + 300; lo = Math.max(400, r ? r - 150 : z - 700); hi = Math.max(z + 100, lo + 300);
      levels = [["easiest", -600], ["easier", -300], ["normal", 0], ["harder", 300], ["hardest", 600]].filter(function (l) { return 1500 + l[1] >= lo - 250 && 1500 + l[1] <= hi + 250; }).map(function (l) { return l[0]; });
      if (!levels.length) levels = [null];
    }
    var all = [];
    for (var tries = 0; items.length < POOL_MIN && tries < 400; tries += 4) {
      status("Aufgaben werden geladen … " + items.length + " von " + POOL_MIN);
      var rs = await Promise.all([0, 1, 2, 3].map(function (k) {
        var lv = levels[(tries / 4 + k) % levels.length];
        return fetch("https://lichess.org/api/puzzle/next" + (lv ? "?difficulty=" + lv : "")).then(function (r2) { return r2.json(); }).catch(function () { return null; });
      }));
      rs.forEach(function (j) {
        if (!j || !j.puzzle || !j.game || seen[j.puzzle.id]) return;
        seen[j.puzzle.id] = 1;
        var it = { id: j.puzzle.id, rating: j.puzzle.rating, pgn: j.game.pgn, solution: j.puzzle.solution, themes: j.puzzle.themes };
        if (j.puzzle.rating >= lo && j.puzzle.rating <= hi) items.push(it); else all.push(it);
      });
      if (tries >= 160 && items.length < 25) { while (items.length < POOL_MIN && all.length) items.push(all.shift()); }
    }
    while (items.length < POOL_MIN && all.length) items.push(all.shift());
    if (fresh) items.sort(function (a, b) { return a.rating - b.rating; });
    if (items.length) { try { await db.doc("puzzles/pool").set({ items: items }); } catch (e) {} }
    return items;
  }
  async function run(d) {
    window.SCH_FREI = !(d.wp && d.wp.length);
    // The user's own games and rating history (Lichess/chess.com account) are merged into the seed data.
    try {
      var es = await db.doc("daten/eigene").get();
      if (es && es.exists) {
        var e = es.data(), seenF = {};
        d.ef = (d.ef || []).concat(e.ef || []).filter(function (x) { var k = x[0]; if (seenF[k]) return false; seenF[k] = 1; return true; });
        d.rate = Object.assign({}, d.rate || {}, e.rate || {});
      }
    } catch (e2) {}
    if (window.SCH_FREI) {
      var note = document.createElement("p");
      note.style.cssText = "max-width:420px;margin:48px auto;font-family:system-ui,sans-serif;color:#5E6A61";
      document.body.prepend(note);
      var items = await loadPool(function (t) { note.textContent = t; }, d);
      if (!items.length) { note.innerHTML = "Die Aufgaben konnten gerade nicht geladen werden. <a href='' onclick='location.reload();return false'>Noch einmal versuchen</a>"; return; }
      note.remove();
      d.wp = items; d.lines = [];
    }
    var hide = document.getElementById("sch-hide"); if (hide) hide.remove();
    document.getElementById("wpdata").textContent = JSON.stringify(d.wp || []);
    document.getElementById("linesdata").textContent = JSON.stringify(d.lines || []);
    document.getElementById("efdata").textContent = JSON.stringify(d.ef || []);
    document.getElementById("ratehist").textContent = JSON.stringify(d.rate || {});
    var s = document.createElement("script");
    s.textContent = main.textContent;
    document.body.appendChild(s);
  }
  var snap;
  try { snap = await db.doc("daten/start").get(); } catch (e) { snap = null; }
  if (snap && snap.exists) return run(snap.data());
  var box = document.createElement("div");
  box.style.cssText = "max-width:420px;margin:48px auto;padding:20px;font-family:system-ui,sans-serif;border:1px solid #D9DDD3;border-radius:12px;background:#fff;color:#1E241F;display:flex;flex-direction:column;gap:12px";
  var btn = "font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:1px solid #B3261E;background:#B3261E;color:#fff;cursor:pointer";
  var inp = "font:inherit;padding:8px;border:1px solid #D9DDD3;border-radius:6px;width:100%;box-sizing:border-box";
  box.innerHTML = "<h2 style='margin:0'>Willkommen beim Schachtraining</h2>"
    + "<p style='margin:0;color:#5E6A61'>Trag deinen Benutzernamen ein, dann holt die Seite deine Wertung und Partien. Dazu gibt es freie Taktikaufgaben und die Kurzlektionen. Beides kannst du später unter Anpassen ändern.</p>"
    + "<label>Lichess-Benutzername<input id='sch-li' type='text' autocomplete='off' autocapitalize='off' style='" + inp + "'></label>"
    + "<label>chess.com-Benutzername (optional)<input id='sch-cc' type='text' autocomplete='off' autocapitalize='off' style='" + inp + "'></label>"
    + "<label>Ziel-Wertung<input id='sch-ziel' type='number' min='600' max='2800' step='50' placeholder='1500' style='" + inp + "'></label>"
    + "<button id='sch-new-go' style='" + btn + "'>Los geht's</button><p id='sch-new-msg' style='margin:0;color:#5E6A61' aria-live='polite'></p>"
    + "<hr style='border:0;border-top:1px solid #D9DDD3;width:100%'><details><summary style='cursor:pointer;color:#5E6A61'>Ich habe eine Datei schach-daten.json</summary>"
    + "<p style='color:#5E6A61'>Die Datei mit Aufgaben und Daten, die du bekommen hast.</p><input id='sch-seed' type='file' accept='application/json,.json'> <button id='sch-seed-go' style='" + btn + "'>Einlesen</button><p id='sch-seed-msg' style='margin:8px 0 0;color:#5E6A61' aria-live='polite'></p></details>";
  box.querySelector("#sch-new-go").addEventListener("click", async function () {
    var msg = box.querySelector("#sch-new-msg"), li = box.querySelector("#sch-li").value.trim(), cc = box.querySelector("#sch-cc").value.trim(), z = +box.querySelector("#sch-ziel").value;
    try {
      msg.textContent = "Einen Moment …";
      await db.doc("daten/start").set({ wp: [], lines: [], ef: [], rate: {}, frei: true });
      await db.doc("einstellungen/konten").set({ lichess: li, chesscom: cc });
      if (z >= 600 && z <= 2800) await db.doc("einstellungen/ui").set({ ziel: z });
      msg.textContent = "Fertig. Die Seite lädt …";
      location.hash = (li || cc) ? "anpassen" : "";
      setTimeout(function () { location.reload(); }, 400);
    } catch (e) { msg.textContent = "Das hat nicht geklappt: " + (e && e.message || "Fehler"); }
  });
  document.body.prepend(box);
  box.querySelector("#sch-seed-go").addEventListener("click", async function () {
    var msg = box.querySelector("#sch-seed-msg"), f = box.querySelector("#sch-seed").files[0];
    if (!f) { msg.textContent = "Bitte die Datei wählen."; return; }
    try {
      var j = JSON.parse(await f.text()), docs = j.docs || {}, n = 0;
      if (!docs["daten/start"] || !docs["daten/start"].wp) throw new Error("Das ist nicht die Datei schach-daten.json.");
      msg.textContent = "Einen Moment…";
      for (var path in docs) {
        if (!/^[a-z]+\/[A-Za-z0-9_.:-]+$/.test(path) || !docs[path] || typeof docs[path] !== "object") continue;
        await db.doc(path).set(docs[path]);
        n++;
      }
      msg.textContent = n + " Einträge gespeichert. Die Seite lädt neu …";
      setTimeout(function () { location.reload(); }, 600);
    } catch (e) { msg.textContent = "Das hat nicht geklappt: " + (e && e.message || "Fehler"); }
  });
});
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
