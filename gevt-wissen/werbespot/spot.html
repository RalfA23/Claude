<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G.E. Ving Tsun – Spot</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;margin:0 auto;height:100vh;aspect-ratio:9/16;max-width:100vw}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=32,cv=document.getElementById('c'),g=cv.getContext('2d');
const BG='#0a0a0b',INK='#f3efe6',RED='#e3120b',DIM='#8a8780';
const F='"Inter Display","Inter",sans-serif';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,4), eio=x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(s){let x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function txt(s,x,y,size,o={}){
  g.save();g.font=`${o.w||900} ${size}px ${F}`;g.letterSpacing=(o.ls??-0.02)*size+'px';
  let m=g.measureText(s).width,mw=o.max||920;if(m>mw){size*=mw/m;g.font=`${o.w||900} ${size}px ${F}`;g.letterSpacing=(o.ls??-0.02)*size+'px'}
  g.textAlign=o.al||'center';g.textBaseline='middle';g.globalAlpha=cl(o.a??1);g.fillStyle=o.c||INK;
  g.translate(x,y);if(o.s)g.scale(o.s,o.s);g.fillText(s,0,0);g.restore();return size}
// Wort knallt rein
function slam(s,x,y,size,lt,o={}){if(lt<0)return;const p=eo(pr(lt,0,.22));txt(s,x,y,size,{...o,a:p*(o.a??1),s:lerp(1.7,1,p)})}
function rise(s,x,y,size,lt,o={}){if(lt<0)return;const p=eo(pr(lt,0,.5));txt(s,x,y+lerp(40,0,p),size,{...o,a:p*(o.a??1)})}
function label(n,s,lt){const p=eo(pr(lt,0,.4));g.save();g.globalAlpha=p;g.fillStyle=RED;g.fillRect(80,292,lerp(0,56,p),6);g.restore();
  txt(n,160,296,34,{al:'left',c:RED,a:p,ls:.08});txt(s,222,296,34,{al:'left',c:INK,a:p*.9,w:600,ls:.14})}
function line(x1,y1,x2,y2,c,w,a=1){g.save();g.globalAlpha=cl(a);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.restore()}
function poly(pts,p,c,w,a=1){ // Teil-Polylinie
  let L=0,seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  let rest=L*cl(p);g.save();g.globalAlpha=cl(a);g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...pts[0]);let end=pts[0];
  for(let i=1;i<pts.length&&rest>0;i++){const q=Math.min(1,rest/seg[i-1]);end=[lerp(pts[i-1][0],pts[i][0],q),lerp(pts[i-1][1],pts[i][1],q)];g.lineTo(...end);rest-=seg[i-1]}
  g.stroke();g.restore();return end}
function ring(x,y,r,c,w,a){if(a<=0||r<=0)return;g.save();g.globalAlpha=cl(a);g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.restore()}
function dot(x,y,r,c,a=1){g.save();g.globalAlpha=cl(a);g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore()}
function flash(lt,c='#fff',k=.5){const a=(1-pr(lt,0,.25))*k;if(lt<0||a<=0)return;g.save();g.globalAlpha=a;g.fillStyle=c;g.fillRect(0,0,W,H);g.restore()}

const HITS=[.3,.8,1.3,4.8,7,11.2,12.9,15.4,19.6,23.2,24.7,26.8];
const T={s2:3.2,s2b:4.8,s3:7,s4:11.2,s5:15.4,s6:19.6,s7:23.2,s8:26.8};

function render(t){
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.fillStyle=BG;g.fillRect(0,0,W,H);
  // Kamerawackeln nach Einschlägen
  let sh=0;for(const h of HITS){const d=t-h;if(d>=0&&d<.35)sh=Math.max(sh,(1-d/.35)**2)}
  const f=Math.floor(t*30);g.translate((rnd(f)-.5)*26*sh,(rnd(f+9)-.5)*26*sh);

  if(t<T.s2){ // 1 — Hook
    for(const b of [.3,.8,1.3,2.3]){const d=t-b;ring(540,960,d*900,INK,3,(1-pr(d,0,.9))*.18)}
    slam('DU BRAUCHST',540,790,96,t-.3,{c:DIM});
    slam('KEINE 100',540,930,190,t-.8);
    slam('TECHNIKEN.',540,1110,150,t-1.3);
    const p=eio(pr(t,2.3,2.65));if(p>0){g.fillStyle=RED;g.fillRect(70,1005,940*p,22)}
  }else if(t<T.s2b){ // 2a — Technik-Flut
    const lt=t-T.s2,p=lt/1.6,n=Math.min(100,Math.floor(1+99*p*p));
    for(let i=0;i<14;i++){const k=Math.floor(lt*24)+i*7;txt('TECHNIK '+(1+Math.floor(rnd(k)*99)),rnd(k+1)*W,200+rnd(k+2)*1500,40+rnd(k+3)*70,{c:DIM,a:.12+.25*rnd(k+4)*p,max:2000})}
    txt('#'+n,540+(rnd(f)-.5)*30*p,960,380,{c:n>=100?RED:INK});
    txt('GRIFFE. KONTER. KOMBINATIONEN.',540,1230,44,{c:DIM,w:600,ls:.1});
  }else if(t<T.s3){ // 2b — Ein Prinzip
    const lt=t-T.s2b;flash(lt,'#fff',.9);
    slam('DU BRAUCHST',540,820,96,lt-.15,{c:DIM});
    slam('EIN',540,985,230,lt-.55,{c:RED});
    slam('PRINZIP.',540,1180,200,lt-.95);
  }else if(t<T.s4){ // 3 — Mitte
    const lt=t-T.s3;label('01','ZENTRALLINIE',lt);
    const p=eio(pr(lt,.1,.8));line(540,0,540,H*p,RED,6);
    for(let i=0;i<4;i++){const d=((lt-.8+i*.6)%2.4);if(lt>.8)ring(540,820,d*300,INK,2,(1-d/2.4)*.35)}
    if(lt>.8)dot(540,820,16*eo(pr(lt,.8,1.1)),RED);
    g.fillStyle=BG;g.globalAlpha=eo(pr(lt,1.1,1.4));g.fillRect(60,1210,960,330);g.globalAlpha=1;
    slam('KRAFT KOMMT',540,1290,120,lt-1.2);
    slam('AUS DER MITTE.',540,1440,120,lt-1.7,{c:RED});
  }else if(t<T.s5){ // 4 — Gleichzeitigkeit
    const lt=t-T.s4,hit=1.7;label('02','GLEICHZEITIGKEIT',lt);
    line(540,330,540,1150,INK,2,.15);ring(540,380,34,INK,3,.7);dot(540,380,8,INK,.7);
    const pa=pr(lt,.5,hit),K=[540,800];
    // Angriff von außen: wird im Kontakt aus der Mitte gedrängt
    const A=[[1000,300],K,[250,1050],[60,1120]];
    poly(A,lt<hit?pa*.52:.52+eo(pr(lt,hit,hit+.6))*.48,INK,10,lt<hit?1:1-pr(lt,hit+.4,hit+1.4)*.75);
    // eigene Linie: durch die Mitte ins Ziel
    const e=poly([[540,1150],K,[540,380]],lt<hit?pa*.455:.455+eo(pr(lt,hit,hit+.35))*.545,RED,14);
    dot(e[0],e[1],14,RED);
    if(lt>=hit){flash(lt-hit,'#fff',.7);ring(540,380,(lt-hit-.3)*500,RED,5,1-pr(lt,hit+.3,hit+1.2));ring(K[0],K[1],(lt-hit)*380,INK,3,(1-pr(lt,hit,hit+.7))*.6)}
    slam('ABWEHR UND ANGRIFF.',540,1310,92,lt-.3);
    slam('IM SELBEN MOMENT.',540,1430,104,lt-hit,{c:RED});
  }else if(t<T.s6){ // 5 — Physik
    const lt=t-T.s5;label('03','PHYSIK STATT KRAFT',lt);
    const a=eo(pr(lt,0,.4));g.save();g.globalAlpha=a;g.strokeStyle=RED;g.lineWidth=8;g.lineJoin='round';g.beginPath();g.moveTo(540,640);g.lineTo(760,1040);g.lineTo(320,1040);g.closePath();g.stroke();g.globalAlpha=a*.12;g.fillStyle=RED;g.fill();g.restore();
    [-150,-90,-30,30,90,150].forEach((dx,i)=>{const s=Math.sign(dx),ax=Math.abs(dx),x=540+dx,y=640+ax*400/220;
      const lp=((lt-.4-i*.13)%1.6)/1.1;if(lt>.4+i*.13)poly([[x,380],[x,y],[540+s*250,1090],[540+s*420,1180]],lp,INK,5,cl(2.2-lp*2)*.9)});
    slam('DISTANZ.',540,1290,84,lt-.5,{c:DIM});slam('POSITION.',540,1390,84,lt-1.1,{c:DIM});slam('WINKEL.',540,1490,84,lt-1.7,{c:DIM});
    if(lt>2.5){g.fillStyle=BG;g.fillRect(40,1220,1000,340);slam('KEIN KRAFTAKT.',540,1310,110,lt-2.5);slam('PHYSIK.',540,1460,170,lt-3,{c:RED})}
  }else if(t<T.s7){ // 6 — Ruhe
    const lt=t-T.s6;label('04','EMOTIONALE KONTROLLE',lt);
    const amp=260*(1-eio(pr(lt,.4,2.1))),calm=pr(lt,1.7,2.2);
    g.save();g.strokeStyle=calm>.5?INK:RED;g.lineWidth=6;g.lineJoin='round';g.beginPath();
    for(let x=0;x<=W;x+=12){const env=Math.sin(Math.PI*x/W);const y=800+amp*env*(Math.sin(x*.021+f*1.9)*.5+Math.sin(x*.057+f*2.7)*.3+(rnd(x+f*13)-.5)*.9);x?g.lineTo(x,y):g.moveTo(x,y)}
    g.stroke();g.restore();
    if(lt<2.1){slam('WUT',540,1300,200,lt-.1,{c:RED});slam('TRIFFT NICHT.',540,1470,110,lt-.5)}
    else{flash(lt-2.1,'#fff',.25);slam('RUHE',540,1300,220,lt-2.1);slam('TRIFFT.',540,1480,150,lt-2.5)}
    rise('Präzision braucht einen klaren Kopf.',540,1040,40,lt-2.7,{w:500,c:DIM,ls:.02});
  }else if(t<T.s8){ // 7 — Verstehen
    const lt=t-T.s7;
    if(lt<1.5){slam('NICHT',540,860,210,lt-.05);slam('NACHMACHEN.',540,1050,150,lt-.45);const p=eio(pr(lt,1,1.3));g.fillStyle=RED;g.fillRect(70,950,940*p,22)}
    else{flash(lt-1.5,RED,.8);slam('VERSTEHEN.',540,940,190,lt-1.5,{c:RED});rise('Kung Fu für Menschen, die denken.',540,1110,50,lt-2.1,{w:600,ls:.01})}
  }else{ // 8 — Endcard
    const lt=t-T.s8;flash(lt,'#fff',.8);
    const p=eio(pr(lt,.1,.8));line(540,560-170*p,540,560+170*p,RED,8);ring(540,560,130*eo(pr(lt,.3,1)),INK,6,pr(lt,.3,.6));
    slam('G.E. VING TSUN',540,880,128,lt-.5);
    rise('SIFU GÖKSEL ERDOGAN',540,985,42,lt-.9,{w:600,ls:.3,c:RED});
    rise('Lehrer aus aller Welt reisen',540,1170,48,lt-1.6,{w:500,ls:0,c:DIM});
    rise('zu ihm nach Stuttgart.',540,1235,48,lt-1.6,{w:500,ls:0,c:DIM});
    rise('Du nur nach Hamburg.',540,1340,64,lt-2.5,{w:800,ls:-.01});
    const b=eo(pr(lt,3.2,3.6));if(b>0){g.save();g.globalAlpha=b;g.fillStyle=RED;const w=760*b;g.fillRect(540-w/2,1470,w,120);g.restore();txt('PROBETRAINING',540,1532,54,{ls:.16,a:pr(lt,3.4,3.7)})}
    g.fillStyle='#000';g.globalAlpha=pr(t,DUR-.5,DUR);g.fillRect(-50,-50,W+100,H+100);g.globalAlpha=1;
  }
  // Korn + Vignette
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#fff';for(let i=0;i<1400;i++){g.globalAlpha=.05*rnd(f*31+i);g.fillRect(rnd(f+i*1.7)*W,rnd(f*3+i*2.3)*H,2,2)}
  g.globalAlpha=1;const v=g.createRadialGradient(540,960,500,540,960,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=v;g.fillRect(0,0,W,H);
}
window.render=render;
if(!location.hash.includes('cap')){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)})()}
</script></body></html>
