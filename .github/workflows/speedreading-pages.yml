name: Trainer veröffentlichen (Lesetraining und Schachtraining)

on:
  push:
    branches: [main]
    paths: ["speedreading-trainer/**", "schach-trainer/**", "gevt-wissen/**", "goetterquiz/**", "wortwuerfel/**", "murmelbahn/**", "vestaboard/**", "poker/**", "spiele/**", "flipper/**", "huberman/**", "gesundheit/**", "entspannung/**", "weltkarte/**", "buecher/**", "sprachen/**", "portal/**", ".github/workflows/speedreading-pages.yml"]
  pull_request:
    paths: ["speedreading-trainer/**", "schach-trainer/**", "gevt-wissen/**", "goetterquiz/**", "wortwuerfel/**", "murmelbahn/**", "vestaboard/**", "poker/**", "spiele/**", "flipper/**", "huberman/**", "gesundheit/**", "entspannung/**", "weltkarte/**", "buecher/**", "sprachen/**", "portal/**", ".github/workflows/speedreading-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: speedreading-trainer
        # Public project values (URL and anon key); repo variables override them.
        env:
          SR_SUPABASE_URL: ${{ vars.SR_SUPABASE_URL || 'https://ujnztjqhibcpnqvbfqyw.supabase.co' }}
          SR_SUPABASE_ANON_KEY: ${{ vars.SR_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqbnp0anFoaWJjcG5xdmJmcXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDQ3ODgsImV4cCI6MjEwNzkyMDc4OH0.ZQbj8_UEV4qTchO8wdJFRl5zdliQ0HB8X9-0ENFhX9M' }}
        run: node build.mjs
      - name: Check page script parses
        working-directory: speedreading-trainer
        run: node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Schachtraining
        working-directory: schach-trainer
        run: node build.mjs
      - name: Check Schachtraining script parses
        working-directory: schach-trainer
        run: node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build GEVT-Wissensdatenbank
        working-directory: gevt-wissen
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Götterquiz
        working-directory: goetterquiz
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Wortwürfel
        working-directory: wortwuerfel
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Murmelbahn
        working-directory: murmelbahn
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Check Portal script parses
        run: node -e "const s=require('fs').readFileSync('portal/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Vestaboard
        working-directory: vestaboard
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Poker testen und bauen
        working-directory: poker
        run: node --test test/*.test.mjs && node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Flipper testen und bauen
        working-directory: flipper
        run: node --test test/*.test.mjs && node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Spiele
        working-directory: spiele
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Huberman-Protokolle
        working-directory: huberman
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Gesundheit
        working-directory: gesundheit
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Entspannung testen und bauen
        working-directory: entspannung
        run: node --test test/*.test.mjs && node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Weltkarte
        working-directory: weltkarte
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Bücher
        working-directory: buecher
        run: node build.mjs && node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - name: Build Sprachen
        working-directory: sprachen
        run: node build.mjs
      - name: Seite zusammenstellen (Portal als Hauptadresse, Kurse in Unterordnern)
        # One shared Supabase config for everything: the config.js built for the Lesetraining.
        run: |
          mkdir -p site/lesen site/portal
          cp -r speedreading-trainer/dist/. site/lesen/
          cp -r schach-trainer/dist site/schach
          cp -r gevt-wissen/dist site/gevt
          cp -r goetterquiz/dist site/quiz
          cp -r wortwuerfel/dist site/wortwuerfel
          cp -r murmelbahn/dist site/murmelbahn
          cp -r vestaboard/dist site/vestaboard
          cp -r poker/dist site/poker
          cp -r flipper/dist site/flipper
          cp -r spiele/dist site/spiele
          cp -r huberman/dist site/huberman
          cp -r gesundheit/dist site/gesundheit
          cp -r entspannung/dist site/entspannung
          cp -r weltkarte/dist site/weltkarte
          cp -r buecher/dist site/buecher
          cp -r sprachen/dist site/sprachen
          cp site/lesen/config.js site/schach/config.js
          cp portal/index.html site/index.html
          cp site/lesen/config.js site/config.js
          cp speedreading-trainer/public/impressum.html speedreading-trainer/public/datenschutz.html site/
          cp portal/redirect.html site/portal/index.html
      - name: Fehler-Knopf in alle Kursseiten einhängen
        # portal/fehler.js liegt neben dem Portal; jede index.html darunter bekommt das Skript mit passendem relativen Pfad.
        run: |
          cp portal/fehler.js site/fehler.js
          sed -i "s|src=\"fehler.js\"|src=\"fehler.js?v=${GITHUB_SHA::7}\"|" site/index.html
          find site -mindepth 2 -name index.html ! -path site/portal/index.html | while read -r f; do
            d=$(dirname "${f#site/}"); up=$(echo "$d" | sed 's|[^/]*|..|g')
            tag="<script src=\"$up/fehler.js?v=${GITHUB_SHA::7}\" charset=\"utf-8\" defer></script>"
            if grep -q '</body>' "$f"; then TAG="$tag" perl -0pi -e 's|</body>(?![\s\S]*</body>)|$ENV{TAG}\n</body>|' "$f"; else echo "$tag" >> "$f"; fi
          done
          grep -l 'fehler.js' -r site --include=index.html | wc -l
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
