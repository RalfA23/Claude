name: Speedreading-Trainer veröffentlichen

on:
  push:
    branches: [main]
    paths: ["speedreading-trainer/**", ".github/workflows/speedreading-pages.yml"]
  pull_request:
    paths: ["speedreading-trainer/**", ".github/workflows/speedreading-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: speedreading-trainer
        env:
          SR_SUPABASE_URL: ${{ vars.SR_SUPABASE_URL }}
          SR_SUPABASE_ANON_KEY: ${{ vars.SR_SUPABASE_ANON_KEY }}
        run: node build.mjs
      - name: Check page script parses
        working-directory: speedreading-trainer
        run: node -e "const s=require('fs').readFileSync('dist/index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/g);for(const b of m){new Function(b.replace(/<\/?script>/g,''))}console.log('ok',m.length)"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: speedreading-trainer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
